<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Redes · hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: white;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto; /* SCROLL PERMITIDO */
        }

        .fondo-imagen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .fondo-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5) contrast(1.2);
            transform: scale(1.1);
            animation: slowZoomRedes 30s infinite alternate ease-in-out;
        }

        @keyframes slowZoomRedes {
            0% { transform: scale(1.1); }
            100% { transform: scale(1.25); }
        }

        .overlay-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
            opacity: 0;
            animation: fadeInOverlay 1.5s ease forwards;
        }

        @keyframes fadeInOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ===== BARRA SUPERIOR SOLO EN MÓVIL ===== */
        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 900;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .barra-superior.visible {
            transform: translateY(0);
        }

        .barra-superior::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent);
            pointer-events: none;
        }

        @media (min-width: 701px) {
            .barra-superior {
                display: none;
            }
        }

        .contenedor-redes {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 2rem 120px 2rem;
            pointer-events: none;
        }

        @media (min-width: 701px) {
            .contenedor-redes {
                padding: 80px 2rem 100px 2rem;
            }
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1000px;
            width: 100%;
            pointer-events: auto;
            animation: aparecer 1.2s cubic-bezier(0.25, 0.1, 0.15, 1) forwards 0.2s;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes aparecer {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .red-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 20, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 2rem 1rem 1.2rem 1rem;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            gap: 15px;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInCard 0.8s ease forwards;
        }

        .red-card:nth-child(1) { animation-delay: 0.3s; }
        .red-card:nth-child(2) { animation-delay: 0.4s; }
        .red-card:nth-child(3) { animation-delay: 0.5s; }
        .red-card:nth-child(4) { animation-delay: 0.6s; }
        .red-card:nth-child(5) { animation-delay: 0.7s; }
        .red-card:nth-child(6) { animation-delay: 0.8s; }
        .red-card:nth-child(7) { animation-delay: 0.9s; }
        .red-card:nth-child(8) { animation-delay: 1.0s; }

        @keyframes fadeInCard {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .red-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            background: rgba(20, 20, 35, 0.7);
        }

        .social-icon {
            width: 60px;
            height: 60px;
            fill: white;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
        }

        .red-card:hover .social-icon {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }

        .social-username {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .red-card:hover .social-username {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
            opacity: 1;
            transform: translateY(0);
            animation: showDockFirst 0.1s ease forwards;
        }

        @keyframes showDockFirst {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .dock {
            background: rgba(10, 10, 15, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            opacity: 1;
        }

        .dock-item {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            backdrop-filter: blur(4px);
        }

        .dock-item svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 1.8;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.8);
        }

        .dock-item:hover svg {
            stroke: white;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.7));
            transform: rotate(5deg);
        }

        .dock-item::after {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dock-item:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            top: -40px;
        }

        /* ===== MARCA DE AGUA ===== */
        .marca-agua {
            position: fixed;
            z-index: 1000;
            opacity: 0.7;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: auto;
            width: 300px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            animation: showLogo 0.1s ease forwards;
        }

        @keyframes showLogo {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }

        .marca-agua:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .marca-agua img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            filter: brightness(0.95) drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            position: relative;
            z-index: 2;
        }

        @media (min-width: 701px) {
            .marca-agua {
                bottom: 30px;
                left: 30px;
                width: 300px;
            }
            
            .marca-agua img {
                max-height: 100px;
            }
        }

        @media (max-width: 700px) {
            .marca-agua {
                top: 5px;
                left: 10px;
                width: 200px;
                opacity: 0.9;
                z-index: 1001;
            }
            
            .marca-agua img {
                max-height: 60px;
            }
        }

        @media (max-width: 480px) {
            .marca-agua {
                width: 120px;
            }
            
            .marca-agua img {
                max-height: 60px;
            }

            .barra-superior {
                height: 70px;
            }
        }

        @media (max-width: 900px) {
            .social-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 700px) {
            .contenedor-redes {
                padding: 80px 1rem 100px 1rem;
            }

            .social-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                animation: aparecerMobile 1.2s ease forwards 0.2s;
            }

            @keyframes aparecerMobile {
                0% { opacity: 0; transform: scale(0.9); }
                100% { opacity: 1; transform: scale(1); }
            }

            .red-card {
                padding: 1.5rem 0.8rem 1rem 0.8rem;
                animation: fadeInCardMobile 0.8s ease forwards;
            }

            @keyframes fadeInCardMobile {
                0% { transform: translateY(20px); opacity: 0; }
                100% { transform: translateY(0); opacity: 1; }
            }

            .social-icon {
                width: 45px;
                height: 45px;
            }

            .social-username {
                font-size: 0.75rem;
            }

            .dock-item {
                width: 48px;
                height: 48px;
            }
            
            .dock-item svg {
                width: 24px;
                height: 24px;
            }
            
            .dock-item::after {
                display: none;
            }
            
            .dock-container {
                bottom: 30px;
            }
        }

        @media (max-width: 480px) {
            .social-grid {
                grid-template-columns: 1fr;
                max-width: 280px;
                margin: 0 auto;
            }
            
            .dock-container {
                bottom: 30px;
            }
        }
    </style>
</head>
