<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carlos · Bienvenido</title>
  <style>
    /* ============================================================
       ESTILOS COMUNES (para todas las páginas) + específicos de index
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    body {
      min-height: 100vh;
      background: #0b0d10;
      display: flex;
      flex-direction: column;
    }

    /* ---- BARRA DE NAVEGACIÓN (transparente) ---- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.2rem 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 10, 14, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 100;
    }

    .logo .star-logo {
      font-size: 2rem;
      color: #f0f3f8;
      letter-spacing: 2px;
      font-weight: 300;
      opacity: 0.9;
      transition: transform 0.2s ease;
    }

    .logo .star-logo:hover {
      transform: rotate(20deg) scale(1.05);
    }

    .nav-links {
      display: flex;
      gap: 2.4rem;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      padding: 0.3rem 0.1rem;
      position: relative;
      transition: color 0.25s ease, border-color 0.25s ease;
      border-bottom: 1.5px solid transparent;
    }

    /* línea inferior activa (HOME) – más fina */
    .nav-links a.active {
      color: #ffffff;
      border-bottom: 1.5px solid #ffffff;
    }

    /* hover: línea muy sutil */
    .nav-links a:hover {
      color: #ffffff;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    .nav-links a.active:hover {
      border-bottom: 1.5px solid #ffffff;
    }

    /* ===== CONTENIDO PRINCIPAL (fondo imagen) ===== */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* SIN CAJA – texto directo sobre la imagen */
    .hero {
      text-align: center;
      max-width: 800px;
      width: 100%;
      padding: 0 1rem;
    }

    .hero h1 {
      font-size: 4.8rem;
      font-weight: 200;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
      line-height: 1.1;
    }

    /* BOTÓN más gordito y minimalista */
    .btn-proyectos {
      display: inline-block;
      background: rgba(20, 25, 35, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.9rem 4rem;
      border-radius: 80px;
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .btn-proyectos:hover {
      background: rgba(40, 50, 70, 0.3);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.03);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .credito {
      margin-top: 3.5rem;
      font-size: 0.7rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 200;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 1.8rem;
      width: 30%;
      margin-left: auto;
      margin-right: auto;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .navbar {
        padding: 0.9rem 1.5rem;
        flex-wrap: wrap;
      }
      .nav-links {
        gap: 1.2rem;
      }
      .nav-links a {
        font-size: 0.85rem;
      }
      .hero h1 {
        font-size: 3rem;
        letter-spacing: 2px;
      }
      .btn-proyectos {
        padding: 0.7rem 2.8rem;
        font-size: 1.1rem;
      }
      .credito {
        width: 50%;
      }
    }
  </style>
</head>
<body>
  <!-- BARRA DE NAVEGACIÓN -->
  <header class="navbar">
    <div class="logo">
      <span class="star-logo">✦</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">Proyectos</a>
      <a href="#">Redes</a>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL – sin caja, texto directo sobre la imagen -->
  <main class="main-content">
    <div class="hero">
      <h1>¡Bienvenido/a!</h1>
      <a href="#" class="btn-proyectos">Proyectos</a>
      <p class="credito">CREADO POR CARLOS</p>
    </div>
  </main>

  <script>
    // ============================================================
    //  COMPORTAMIENTO COMÚN (para todas las páginas) + específico
    // ============================================================
    (function() {
      'use strict';

      document.addEventListener('DOMContentLoaded', function() {
        console.log('✨ Bienvenido a la web de Carlos · (todo en uno)');

        // ---- NAVEGACIÓN: actualizar clase activa al hacer clic ----
        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(link => {
          link.addEventListener('click', function(e) {
            if (this.getAttribute('href') === '#') {
              e.preventDefault();
            }
            navLinks.forEach(l => l.classList.remove('active'));
            this.classList.add('active');
          });
        });

        // ---- ANIMACIÓN DE ENTRADA para el título (específico) ----
        const title = document.querySelector('.hero h1');
        if (title) {
          title.style.opacity = '0';
          title.style.transform = 'translateY(10px)';
          setTimeout(() => {
            title.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
            title.style.opacity = '1';
            title.style.transform = 'translateY(0)';
          }, 100);
        }

        // ---- BOTÓN "Proyectos" con feedback (específico) ----
        const btn = document.querySelector('.btn-proyectos');
        if (btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
              this.style.transform = 'scale(1)';
            }, 150);
            alert('🚀 Proyectos (demo)');
          });
        }

        // ---- CRÉDITO con efecto hover sutil (específico) ----
        const credito = document.querySelector('.credito');
        if (credito) {
          credito.addEventListener('mouseenter', () => {
            credito.style.transition = 'color 0.3s';
            credito.style.color = 'rgba(255,255,240,0.6)';
          });
          credito.addEventListener('mouseleave', () => {
            credito.style.color = 'rgba(255,255,255,0.3)';
          });
        }
      });
    })();
  </script>
</body>
</html>
