<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos · Bienvenido</title>
    <style>
        /* ============================================================
           ESTILOS COMUNES + específicos de index
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f0eb;
            /* fallback */
        }

        /* ---- FONDO MINIMALISTA CON COLORES SUAVES (gradiente) ---- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(145deg, #f9f6f2 0%, #e8e0d8 50%, #dfd6cc 100%);
            position: relative;
            /* para posicionar el crédito absoluto */
        }

        /* ---- BARRA DE NAVEGACIÓN (transparente) ---- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 2.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 252, 248, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 100;
        }

        /* ---- ESTRELLA (logo) con animación y cursor ---- */
        .logo {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .logo .star-logo {
            font-size: 2.2rem;
            color: #2c2a28;
            letter-spacing: 2px;
            font-weight: 300;
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* animación de giro al hacer clic (se aplica con JS) */
        .logo .star-logo.spin {
            transform: rotate(360deg) scale(1.1);
        }

        .logo:hover .star-logo {
            transform: scale(1.08);
        }

        .nav-links {
            display: flex;
            gap: 2.4rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(40, 38, 36, 0.65);
            font-weight: 300;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            padding: 0.3rem 0.1rem;
            position: relative;
            transition: color 0.25s ease, border-color 0.25s ease;
            border-bottom: 1.5px solid transparent;
        }

        /* línea inferior activa (HOME) – más fina */
        .nav-links a.active {
            color: #1a1816;
            border-bottom: 1.5px solid #1a1816;
        }

        /* hover: línea muy sutil */
        .nav-links a:hover {
            color: #1a1816;
            border-bottom: 1.5px solid rgba(26, 24, 22, 0.3);
        }

        .nav-links a.active:hover {
            border-bottom: 1.5px solid #1a1816;
        }

        /* ===== CONTENIDO PRINCIPAL – sin caja ===== */
        .hero {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 0 1rem;
        }

        .hero h1 {
            font-size: 5.2rem;
            font-weight: 200;
            letter-spacing: 8px;
            color: #1a1816;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 4rem;
            /* más separación con el botón */
            line-height: 1.1;
        }

        /* BOTÓN más gordito, minimalista y alejado */
        .btn-proyectos {
            display: inline-block;
            background: rgba(26, 24, 22, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(26, 24, 22, 0.15);
            padding: 1rem 4.5rem;
            border-radius: 80px;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1816;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .btn-proyectos:hover {
            background: rgba(26, 24, 22, 0.1);
            border-color: rgba(26, 24, 22, 0.3);
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        /* ---- CRÉDITO EN ESQUINA INFERIOR DERECHA (absoluto) ---- */
        .credito {
            position: absolute;
            bottom: 2.5rem;
            right: 3rem;
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(26, 24, 22, 0.25);
            font-weight: 200;
            transition: color 0.3s ease;
            user-select: none;
        }

        .credito:hover {
            color: rgba(26, 24, 22, 0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .navbar {
                padding: 0.9rem 1.5rem;
                flex-wrap: wrap;
            }
            .nav-links {
                gap: 1.2rem;
            }
            .nav-links a {
                font-size: 0.85rem;
            }
            .hero h1 {
                font-size: 3.2rem;
                letter-spacing: 4px;
                margin-bottom: 3rem;
            }
            .btn-proyectos {
                padding: 0.8rem 2.8rem;
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            .credito {
                bottom: 1.5rem;
                right: 1.5rem;
                font-size: 0.55rem;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2.5rem;
                letter-spacing: 2px;
                margin-bottom: 2.5rem;
            }
            .btn-proyectos {
                padding: 0.7rem 2rem;
                font-size: 1rem;
            }
            .credito {
                bottom: 1rem;
                right: 1rem;
                font-size: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo" id="logoStar">
            <span class="star-logo">✦</span>
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Proyectos</a>
            <a href="#">Redes</a>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL – fondo minimalista con colores suaves -->
    <main class="main-content">
        <div class="hero">
            <h1>¡Bienvenido/a!</h1>
            <a href="#" class="btn-proyectos">Proyectos</a>
        </div>
        <!-- Crédito en esquina inferior derecha -->
        <p class="credito">CREADO POR CARLOS</p>
    </main>

    <script>
        // ============================================================
        //  COMPORTAMIENTO ÚNICO (todo en uno)
        // ============================================================
        (function() {
            'use strict';

            document.addEventListener('DOMContentLoaded', function() {
                console.log('✨ Bienvenido — Carlos · diseño minimalista');

                // ---- NAVEGACIÓN: actualizar clase activa al hacer clic ----
                const navLinks = document.querySelectorAll('.nav-links a');
                navLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        if (this.getAttribute('href') === '#') {
                            e.preventDefault();
                        }
                        navLinks.forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                // ---- ESTRELLA: al hacer clic → vuelve al index y gira ----
                const logoContainer = document.getElementById('logoStar');
                const star = document.querySelector('.star-logo');

                if (logoContainer && star) {
                    logoContainer.addEventListener('click', function(e) {
                        e.preventDefault();

                        // 1. Añadir clase para girar
                        star.classList.remove('spin');
                        // Forzar reflow para reiniciar animación
                        void star.offsetWidth;
                        star.classList.add('spin');

                        // 2. Redirigir al index (home) después de un breve delay
                        //    para que se vea el giro
                        setTimeout(function() {
                            // Simular navegación a index (Home)
                            // En una página real: window.location.href = 'index.html';
                            // Como estamos en index, simplemente recargamos o llevamos a #home
                            // Pero para demostración: marcamos Home como activo y limpiamos otros
                            navLinks.forEach(l => l.classList.remove('active'));
                            // Buscar el enlace que dice "Home" (o el primero)
                            const homeLink = Array.from(navLinks).find(l => l.textContent.trim() === 'Home');
                            if (homeLink) {
                                homeLink.classList.add('active');
                            }
                            // Mostrar mensaje (opcional, para feedback)
                            console.log('🏠 Volviendo al inicio');
                            // Si quisieras recargar: location.reload();
                            // Pero mejor simulamos el comportamiento sin recargar
                            // para que no se pierda la animación.
                        }, 450); // tiempo suficiente para ver el giro
                    });
                }

                // ---- BOTÓN "Proyectos" con feedback ----
                const btn = document.querySelector('.btn-proyectos');
                if (btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        this.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            this.style.transform = 'scale(1)';
                        }, 150);
                        alert('🚀 Proyectos (demo)');
                    });
                }

                // ---- ANIMACIÓN DE ENTRADA para el título ----
                const title = document.querySelector('.hero h1');
                if (title) {
                    title.style.opacity = '0';
                    title.style.transform = 'translateY(12px)';
                    setTimeout(() => {
                        title.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                        title.style.opacity = '1';
                        title.style.transform = 'translateY(0)';
                    }, 120);
                }

                // ---- CRÉDITO: efecto hover ya está en CSS ----
                // (no necesita JS adicional)
            });
        })();
    </script>
</body>
</html>
