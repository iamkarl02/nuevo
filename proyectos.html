<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Proyectos · hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: #000000;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto; /* SCROLL PERMITIDO EN MÓVIL */
        }

        /* En PC no hay scroll (carrusel ocupa toda la pantalla) */
        @media (min-width: 701px) {
            html, body {
                overflow: hidden;
                height: 100%;
            }
        }

        .carrusel-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .carrusel-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .carrusel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.15, 1);
            will-change: transform;
        }

        .proyecto-columna {
            flex: 0 0 33.333%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            animation: fadeInColumna 0.8s ease forwards;
        }

        .proyecto-columna:nth-child(1) { animation-delay: 0.1s; }
        .proyecto-columna:nth-child(2) { animation-delay: 0.2s; }
        .proyecto-columna:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInColumna {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .imagen-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.15, 1), filter 0.8s ease;
            filter: brightness(0.85) saturate(1.1);
            transform: scale(1.1);
            animation: zoomIn 1.2s cubic-bezier(0.25, 0.1, 0.15, 1) forwards;
        }

        @keyframes zoomIn {
            0% { transform: scale(1.3); filter: brightness(0.5); }
            100% { transform: scale(1.1); filter: brightness(0.85) saturate(1.1); }
        }

        .proyecto-columna:hover .imagen-fondo {
            transform: scale(1.15);
            filter: brightness(1) saturate(1.2);
        }

        .overlay-contraste {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                rgba(0,0,0,0.5) 0%, 
                rgba(0,0,0,0.3) 40%,
                rgba(0,0,0,0.6) 100%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: fadeInOverlay 1.2s ease forwards;
        }

        @keyframes fadeInOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .contenido-superpuesto {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
            padding: 2rem;
            color: white;
            pointer-events: none;
            opacity: 0;
            animation: slideUpContent 1s cubic-bezier(0.25, 0.1, 0.15, 1) forwards;
            animation-delay: 0.3s;
        }

        @keyframes slideUpContent {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .contenido-superpuesto h2 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.7);
            line-height: 1.2;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpText 0.6s ease forwards;
            animation-delay: 0.5s;
        }

        .contenido-superpuesto p {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            font-weight: 300;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
            max-width: 300px;
            margin: 0 auto 2rem auto;
            line-height: 1.5;
            padding: 0 1rem;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpText 0.6s ease forwards;
            animation-delay: 0.6s;
        }

        .boton-flotante {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            display: inline-block;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.4);
            text-transform: uppercase;
            font-weight: 400;
            min-width: 160px;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            animation: fadeInButton 0.6s ease forwards;
            animation-delay: 0.7s;
        }

        @keyframes slideUpText {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInButton {
            0% { transform: translateY(20px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .boton-flotante:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 15px 35px -5px black;
            transform: scale(1.05) translateY(-2px);
            letter-spacing: 2px;
        }

        .proyecto-columna:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 1px;
            background: rgba(255,255,255,0.1);
            z-index: 10;
            pointer-events: none;
        }

        .carrusel-flechas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            line-height: 1;
            padding: 0;
            text-align: center;
            opacity: 0;
            animation: fadeInFlecha 0.8s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes fadeInFlecha {
            0% { opacity: 0; transform: translateY(-50%) scale(0.8); }
            100% { opacity: 1; transform: translateY(-50%) scale(1); }
        }

        .flecha span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 32px;
            margin-top: -2px;
        }

        .flecha:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .flecha-izquierda {
            left: 20px;
        }

        .flecha-derecha {
            right: 20px;
        }

        .carrusel-indicadores {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
            max-width: 200px;
            justify-content: flex-end;
        }

        .indicador {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            flex-shrink: 0;
            transform: scale(1);
            opacity: 0;
            animation: fadeInIndicador 0.5s ease forwards;
        }

        .indicador:nth-child(1) { animation-delay: 1s; }
        .indicador:nth-child(2) { animation-delay: 1.1s; }
        .indicador:nth-child(3) { animation-delay: 1.2s; }

        @keyframes fadeInIndicador {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .indicador.activo {
            background: white;
            border-color: white;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .indicador:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.3);
        }

        /* ===== BARRA SUPERIOR SOLO EN MÓVIL ===== */
        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 900;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .barra-superior.visible {
            transform: translateY(0);
        }

        .barra-superior::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent);
            pointer-events: none;
        }

        @media (min-width: 701px) {
            .barra-superior {
                display: none;
            }
        }

        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
            opacity: 1;
            transform: translateY(0);
            animation: showDockFirst 0.1s ease forwards;
        }

        @keyframes showDockFirst {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .dock {
            background: rgba(10, 10, 15, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            opacity: 1;
        }

        .dock-item {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            backdrop-filter: blur(4px);
        }

        .dock-item svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 1.8;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.8);
        }

        .dock-item:hover svg {
            stroke: white;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.7));
            transform: rotate(5deg);
        }

        .dock-item::after {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dock-item:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            top: -40px;
        }

        /* ===== MARCA DE AGUA ===== */
        .marca-agua {
            position: fixed;
            z-index: 1000;
            opacity: 0.7;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: auto;
            width: 300px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            animation: showLogo 0.1s ease forwards;
        }

        @keyframes showLogo {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }

        .marca-agua:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .marca-agua img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            filter: brightness(0.95) drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            position: relative;
            z-index: 2;
        }

        @media (min-width: 701px) {
            .marca-agua {
                bottom: 30px;
                left: 30px;
                width: 300px;
            }
            
            .marca-agua img {
                max-height: 100px;
            }
        }

        @media (max-width: 700px) {
            .proyecto-columna {
                flex: 0 0 100%;
            }
            
            .carrusel-flechas {
                display: block;
            }
            
            .flecha {
                width: 50px;
                height: 50px;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.3);
                top: auto;
                bottom: 120px;
                transform: translateY(0);
                box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            }
            
            .flecha-izquierda {
                left: 20px;
                right: auto;
            }
            
            .flecha-derecha {
                right: 20px;
                left: auto;
            }
            
            .flecha span {
                font-size: 28px;
            }
            
            .flecha:hover {
                transform: scale(1.1);
                background: rgba(255, 255, 255, 0.25);
            }
            
            .carrusel-indicadores {
                top: 20px;
                right: 20px;
                gap: 8px;
            }
            
            .indicador {
                width: 10px;
                height: 10px;
            }
            
            .contenido-superpuesto {
                justify-content: center;
                padding: 1rem;
            }
            
            .contenido-superpuesto h2 {
                font-size: 2.2rem;
                margin-bottom: 0.8rem;
            }
            
            .contenido-superpuesto p {
                font-size: 1rem;
                max-width: 300px;
                margin-bottom: 1.8rem;
            }
            
            .boton-flotante {
                min-width: 150px;
                padding: 0.8rem 1.8rem;
                font-size: 0.95rem;
            }

            .marca-agua {
                top: 5px;
                left: 10px;
                width: 200px;
                opacity: 0.9;
                z-index: 1001;
            }
            
            .marca-agua img {
                max-height: 60px;
            }
            
            .dock-item {
                width: 48px;
                height: 48px;
            }
            
            .dock-item svg {
                width: 24px;
                height: 24px;
            }
            
            .dock-item::after {
                display: none;
            }
            
            .dock-container {
                bottom: 30px;
            }

            .proyecto-columna {
                animation: fadeInColumnaMobile 0.8s ease forwards;
            }

            @keyframes fadeInColumnaMobile {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }

            .imagen-fondo {
                animation: zoomInMobile 1.2s ease forwards;
            }

            @keyframes zoomInMobile {
                0% { transform: scale(1.3); filter: brightness(0.5); }
                100% { transform: scale(1.1); filter: brightness(0.85) saturate(1.1); }
            }
        }
        
        @media (max-width: 480px) {
            .flecha {
                width: 45px;
                height: 45px;
                bottom: 110px;
            }
            
            .flecha span {
                font-size: 24px;
            }

            .marca-agua {
                width: 120px;
            }
            
            .marca-agua img {
                max-height: 60px;
            }

            .barra-superior {
                height: 70px;
            }
            
            .contenido-superpuesto h2 {
                font-size: 1.9rem;
            }
            
            .contenido-superpuesto p {
                font-size: 0.9rem;
                padding: 0 0.5rem;
            }
            
            .boton-flotante {
                min-width: 140px;
                padding: 0.7rem 1.5rem;
                font-size: 0.85rem;
            }
            
            .dock-container {
                bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- BARRA SUPERIOR SOLO EN MÓVIL -->
    <div class="barra-superior" id="barraSuperior"></div>

    <div class="carrusel-container">
        <div class="carrusel-wrapper">
            <div class="carrusel-track" id="carruselTrack"></div>
        </div>
        
        <div class="carrusel-flechas">
            <div class="flecha flecha-izquierda" id="flechaIzquierda"><span>←</span></div>
            <div class="flecha flecha-derecha" id="flechaDerecha"><span>→</span></div>
        </div>
        
        <div class="carrusel-indicadores" id="carruselIndicadores"></div>
    </div>
    
    <div class="dock-container">
        <div class="dock">
            <a href="index.html" class="dock-item" data-label="Inicio">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L4 9V21H9V15H15V21H20V9L12 3Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </a>
            <a href="proyectos.html" class="dock-item" data-label="Proyectos">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>

            <a href="redes.html" class="dock-item" data-label="Redes">

                    <path d="M17 7L14 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M7 17L10 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

            <a href="info.html" class="dock-item" data-label="Info">

                    <circle cx="12" cy="16" r="0.5" fill="white" stroke="white" stroke-width="1.5"/>
                </svg>
            </a>
        </div>
    </div>

    <a href="index.html" class="marca-agua" target="_blank" rel="noopener">
        <img src="assets/logo/logo.png" alt="Logo" onerror="this.style.display='none'">
    </a>

    <script>
        (function() {
            const proyectos = [
                {
                    titulo: "PermaTae",
                    subtitulo: "Serie de Minecraft estilo Permadeath con mecánicas personalizadas creadas mediante datapacks.",
                    imagen: "assets/toolbox/hub/proyectos/permatae.png",
                    url: "https://iamkarl02.github.io/hub/proyectos/permatae-wiki/permatae-wiki.html"
                },
                {
                    titulo: "UHC THE MIDDLE HEAD",
                    subtitulo: "Serie de Minecraft Hardcore con una duración máxima de 4 horas y un único intento.",
                    imagen: "assets/toolbox/hub/proyectos/uhc-the-middle-head.png",
                    url: "#"
                },
                {
                    titulo: "FileOrganizerPRO",
                    subtitulo: "Herramienta portable para organizar automáticamente archivos y carpetas con un solo clic.",
                    imagen: "assets/toolbox/hub/proyectos/fileorganizerpro.png",
                    url: "https://github.com/iamkarl02/FileOrganizerPRO"
                },
                {
                    titulo: "Generadores & Herramientas",
                    subtitulo: "Potencia tus ideas sin límites en un espacio libre para crear proyectos de Minecraft, Discord o cualquier plataforma.",
                    imagen: "assets/toolbox/hub/proyectos/generadores&herramientas.png",
                    url: "https://iamkarl02.github.io/Generadores-y-Herramientas/index.html"
                }
            ];

            const proyectosTotales = [
                ...proyectos,
                ...proyectos,
                ...proyectos
            ];

            const track = document.getElementById('carruselTrack');
            const indicadoresContainer = document.getElementById('carruselIndicadores');
            
            const flechaIzq = document.getElementById('flechaIzquierda');
            const flechaDer = document.getElementById('flechaDerecha');
            
            const MOVIMIENTO_POR_CLICK = 33.333;
            
            let posicionActual = proyectos.length * 33.333;
            const totalProyectosReales = proyectos.length;
            
            let isTransitioning = false;

            function crearCarrusel() {
                track.innerHTML = '';
                
                proyectosTotales.forEach((proj, index) => {
                    const columna = document.createElement('div');
                    columna.className = 'proyecto-columna';

                    const img = new Image();
                    img.className = 'imagen-fondo';
                    img.src = proj.imagen || 'https://via.placeholder.com/800x1200/1a1a2e/ffffff?text=PROYECTO';
                    img.alt = proj.titulo;
                    
                    img.onload = function() {
                        this.style.opacity = '1';
                    };

                    const overlay = document.createElement('div');
                    overlay.className = 'overlay-contraste';

                    const contenido = document.createElement('div');
                    contenido.className = 'contenido-superpuesto';

                    const titulo = document.createElement('h2');
                    titulo.textContent = proj.titulo;

                    const subtitulo = document.createElement('p');
                    subtitulo.textContent = proj.subtitulo;

                    const boton = document.createElement('a');
                    boton.className = 'boton-flotante';
                    boton.href = proj.url;
                    boton.textContent = 'ver proyecto';

                    if (proj.url === '#') {
                        boton.addEventListener('click', (e) => {
                            e.preventDefault();
                            alert(`✨ "${proj.titulo}" — demo interactiva`);
                        });
                    } else {
                        boton.target = '_blank';
                        boton.rel = 'noopener noreferrer';
                    }

                    contenido.appendChild(titulo);
                    contenido.appendChild(subtitulo);
                    contenido.appendChild(boton);

                    columna.appendChild(img);
                    columna.appendChild(overlay);
                    columna.appendChild(contenido);

                    track.appendChild(columna);
                });

                crearIndicadores();
                
                setTimeout(() => {
                    actualizarCarrusel(false);
                }, 100);
            }

            function crearIndicadores() {
                indicadoresContainer.innerHTML = '';
                
                for (let i = 0; i < totalProyectosReales; i++) {
                    const indicador = document.createElement('div');
                    indicador.className = 'indicador';
                    if (i === 0) indicador.classList.add('activo');
                    
                    indicador.addEventListener('click', () => {
                        if (isTransitioning) return;
                        if (window.innerWidth <= 700) {
                            posicionActual = (i + totalProyectosReales) * 100;
                        } else {
                            posicionActual = (i + totalProyectosReales) * 33.333;
                        }
                        actualizarCarrusel();
                    });
                    
                    indicadoresContainer.appendChild(indicador);
                }
            }

            function actualizarCarrusel(transition = true) {
                if (isTransitioning && transition) return;
                
                if (!transition) {
                    track.style.transition = 'none';
                } else {
                    track.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.1, 0.15, 1)';
                    isTransitioning = true;
                }
                
                track.style.transform = `translateX(-${posicionActual}%)`;
                
                let paso = (window.innerWidth <= 700) ? 100 : 33.333;
                const proyectoVisible = Math.floor((posicionActual / paso) - totalProyectosReales + 0.1);
                let indiceProyecto = ((proyectoVisible % totalProyectosReales) + totalProyectosReales) % totalProyectosReales;
                
                document.querySelectorAll('.indicador').forEach((ind, i) => {
                    if (i === indiceProyecto) {
                        ind.classList.add('activo');
                    } else {
                        ind.classList.remove('activo');
                    }
                });
                
                if (transition) {
                    setTimeout(() => {
                        track.style.transition = 'none';
                        
                        let limite = totalProyectosReales * 2 * paso;
                        let ajuste = totalProyectosReales * paso;
                        
                        if (posicionActual >= limite) {
                            posicionActual = posicionActual - ajuste;
                        }
                        else if (posicionActual < totalProyectosReales * paso) {
                            posicionActual = posicionActual + ajuste;
                        }
                        
                        track.style.transform = `translateX(-${posicionActual}%)`;
                        isTransitioning = false;
                    }, 800);
                } else {
                    isTransitioning = false;
                }
            }

            function moverIzquierda() {
                if (isTransitioning) return;
                let paso = (window.innerWidth <= 700) ? 100 : MOVIMIENTO_POR_CLICK;
                posicionActual -= paso;
                actualizarCarrusel();
            }
            
            function moverDerecha() {
                if (isTransitioning) return;
                let paso = (window.innerWidth <= 700) ? 100 : MOVIMIENTO_POR_CLICK;
                posicionActual += paso;
                actualizarCarrusel();
            }

            if (flechaIzq) flechaIzq.addEventListener('click', moverIzquierda);
            if (flechaDer) flechaDer.addEventListener('click', moverDerecha);

            document.addEventListener('keydown', (e) => {
                if (isTransitioning) return;
                if (e.key === 'ArrowLeft') {
                    moverIzquierda();
                } else if (e.key === 'ArrowRight') {
                    moverDerecha();
                }
            });

            window.addEventListener('resize', function() {
                let paso = (window.innerWidth <= 700) ? 100 : 33.333;
                let indiceActual = Math.floor((posicionActual / (window.innerWidth <= 700 ? 100 : 33.333)) - totalProyectosReales + 0.5);
                indiceActual = ((indiceActual % totalProyectosReales) + totalProyectosReales) % totalProyectosReales;
                posicionActual = (indiceActual + totalProyectosReales) * paso;
                actualizarCarrusel(false);
            });

            crearCarrusel();
        })();

        window.addEventListener('scroll', function() {
            const barra = document.getElementById('barraSuperior');
            if (window.innerWidth <= 700) {
                if (window.scrollY > 20) {
                    barra.classList.add('visible');
                } else {
                    barra.classList.remove('visible');
                }
            }
        });
    </script>
</body>
</html>
