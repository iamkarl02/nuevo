<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>3 proyectos · carrusel continuo</title>
    <!-- Fuente Inter elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #000000;
        }

        .carrusel-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== ESTRUCTURA DE 3 COLUMNAS ===== */
        .carrusel-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .carrusel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
            will-change: transform;
        }

        /* Cada columna es un proyecto INDIVIDUAL */
        .proyecto-columna {
            flex: 0 0 33.333%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .imagen-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
            filter: brightness(0.85) saturate(1.1);
        }

        .proyecto-columna:hover .imagen-fondo {
            transform: scale(1.05);
            filter: brightness(1) saturate(1.2);
        }

        .overlay-contraste {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                rgba(0,0,0,0.4) 0%, 
                rgba(0,0,0,0.2) 40%,
                rgba(0,0,0,0.4) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .contenido-superpuesto {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
            padding: 2rem;
            color: white;
            pointer-events: none;
        }

        .contenido-superpuesto h2 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.7);
            line-height: 1.2;
        }

        .contenido-superpuesto p {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            font-weight: 300;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
            max-width: 300px;
            margin: 0 auto 2rem auto;
            line-height: 1.5;
            padding: 0 1rem;
        }

        .boton-flotante {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
            display: inline-block;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.4);
            text-transform: uppercase;
            font-weight: 400;
            min-width: 160px;
        }

        .boton-flotante:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 15px 30px -5px black;
            transform: scale(1.02);
            letter-spacing: 1px;
        }

        .proyecto-columna:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 1px;
            background: rgba(255,255,255,0.1);
            z-index: 10;
            pointer-events: none;
        }

        /* ===== FLECHAS PERFECTAMENTE CENTRADAS ===== */
        .carrusel-flechas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            line-height: 1;
            padding: 0;
            text-align: center;
        }

        .flecha span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 32px;
            margin-top: -2px;
        }

        .flecha:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .flecha-izquierda {
            left: 20px;
        }

        .flecha-derecha {
            right: 20px;
        }

        /* ===== INDICADORES - UNO POR CADA PROYECTO ===== */
        .carrusel-indicadores {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
            max-width: 200px;
            justify-content: flex-end;
        }

        .indicador {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .indicador.activo {
            background: white;
            border-color: white;
            transform: scale(1.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .indicador:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.3);
        }

        /* ===== DOCK CON SVG ===== */
        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .dock-trigger-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 99;
            pointer-events: auto;
        }

        .dock-trigger-area:hover ~ .dock-container,
        .dock-container:hover {
            opacity: 1;
            transform: translateY(0);
        }

        .dock {
            background: rgba(10, 10, 15, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .dock-item {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            backdrop-filter: blur(4px);
        }

        .dock-item svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 1.8;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2) translateY(-8px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7);
        }

        .dock-item:hover svg {
            stroke: white;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }

        .dock-item::after {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dock-item:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        /* ===== MARCA DE AGUA - PC (abajo izquierda) ===== */
        .marca-agua {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 200;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            width: 300px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .marca-agua:hover {
            opacity: 1;
        }

        .marca-agua img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            filter: brightness(0.95) drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* ===== RESPONSIVE MÓVIL ===== */
        @media (max-width: 700px) {
            .proyecto-columna {
                flex: 0 0 100%;
            }
            
            /* En móvil, las flechas de escritorio se convierten en las flechas centradas */
            .carrusel-flechas {
                display: block;
            }
            
            /* Ajustamos tamaño de flechas para móvil */
            .flecha {
                width: 50px;
                height: 50px;
                background: rgba(20, 20, 30, 0.6);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
            
            .flecha span {
                font-size: 28px;
            }
            
            .flecha-izquierda {
                left: 15px;
            }
            
            .flecha-derecha {
                right: 15px;
            }
            
            .carrusel-indicadores {
                top: 20px;
                right: 20px;
                gap: 8px;
            }
            
            .indicador {
                width: 10px;
                height: 10px;
            }
            
            .contenido-superpuesto p {
                font-size: 1rem;
                max-width: 400px;
            }
            
            .dock-item {
                width: 48px;
                height: 48px;
            }
            
            .dock-item svg {
                width: 24px;
                height: 24px;
            }
            
            .dock-item::after {
                display: none;
            }
            
            /* ===== MARCA DE AGUA - MÓVIL (arriba izquierda, más grande y más pegado) ===== */
            .marca-agua {
                bottom: auto;           /* Anulamos bottom */
                top: 5px;               /* Arriba */
                left: 5px;               /* MUCHO MÁS A LA IZQUIERDA (antes 10px) */
                width: 100px;             /* MÁS GRANDE (antes 200px) */
                opacity: 0.9;             /* Un poco más visible */
            }
            
            .marca-agua img {
                max-height: 100px;          /* MÁS GRANDE (antes 60px) */
            }
            
            .dock-container {
                bottom: 20px;
            }
        }
        
        /* Ajuste para pantallas muy pequeñas */
        @media (max-width: 480px) {
            .flecha {
                width: 45px;
                height: 45px;
            }
            
            .flecha span {
                font-size: 24px;
            }
            
            /* Logo aún más grande y pegado si es necesario */
            .marca-agua {
                top: 8px;
                left: 3px;                /* Aún más a la izquierda */
                width: 260px;              /* Un poco más pequeño que en 700px pero sigue siendo grande */
            }
            
            .marca-agua img {
                max-height: 75px;
            }
        }
    </style>
</head>
<body>

    <div class="carrusel-container">
        <div class="carrusel-wrapper">
            <div class="carrusel-track" id="carruselTrack"></div>
        </div>
        
        <!-- Flechas perfectamente centradas (funcionan en escritorio y móvil) -->
        <div class="carrusel-flechas">
            <div class="flecha flecha-izquierda" id="flechaIzquierda"><span>←</span></div>
            <div class="flecha flecha-derecha" id="flechaDerecha"><span>→</span></div>
        </div>
        
        <!-- Indicadores - UNO POR CADA PROYECTO -->
        <div class="carrusel-indicadores" id="carruselIndicadores"></div>
    </div>
    
    <!-- Área de activación del dock -->
    <div class="dock-trigger-area"></div>
    
    <!-- DOCK CON SVG -->
    <div class="dock-container">
        <div class="dock">
            <a href="#" class="dock-item" data-label="Inicio">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L4 9V21H9V15H15V21H20V9L12 3Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </a>
            <a href="#" class="dock-item" data-label="Proyectos">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="14" y="3" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="3" y="14" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="14" y="14" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                </svg>
            </a>
            <a href="#" class="dock-item" data-label="Redes">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5" fill="none"/>
                    <circle cx="19" cy="5" r="2" stroke="white" stroke-width="1.5" fill="none"/>
                    <circle cx="5" cy="19" r="2" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M17 7L14 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M7 17L10 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </a>
            <a href="#" class="dock-item" data-label="Info">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M12 8V12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="0.5" fill="white" stroke="white" stroke-width="1.5"/>
                </svg>
            </a>
        </div>
    </div>
    
    <!-- MARCA DE AGUA - Se comporta diferente en PC y móvil -->
    <a href="https://tusitio.com" class="marca-agua" target="_blank" rel="noopener">
        <img src="assets/logo/logo.png" alt="Logo" onerror="this.style.display='none'">
    </a>

    <script>
        (function() {
            // -------------------------------------------------------------
            // PROYECTOS - SOLO LOS 3 QUE ME HAS DADO
            // -------------------------------------------------------------
        const proyectos = [
            // PROYECTO 1
            {
                titulo: "PermaTae",
                subtitulo: "Serie de Minecraft estilo Permadeath con mecánicas personalizadas creadas mediante datapacks.",
                imagen: "assets/toolbox/hub/proyectos/permatae.png",
                url: "#"
            },
            // PROYECTO 2
                        {
                titulo: "UHC THE MIDDLE HEAD",
                subtitulo: "Serie de Minecraft Hardcore con una duración máxima de 4 horas y un único intento.",
                imagen: "assets/toolbox/hub/proyectos/uhc-the-middle-head.png",
                url: "#"
            },
            // PROYECTO 3
            {
                titulo: "FileOrganizerPRO",
                subtitulo: "Herramienta portable para organizar automáticamente archivos y carpetas con un solo clic.",
                imagen: "assets/toolbox/hub/proyectos/fileorganizerpro.png",
                url: "#"
            }
        ];

            // Duplicamos para efecto infinito (necesario para que funcione el loop)
            const proyectosTotales = [
                ...proyectos,
                ...proyectos,
                ...proyectos
            ];

            const track = document.getElementById('carruselTrack');
            const indicadoresContainer = document.getElementById('carruselIndicadores');
            
            // Flechas (las mismas para escritorio y móvil)
            const flechaIzq = document.getElementById('flechaIzquierda');
            const flechaDer = document.getElementById('flechaDerecha');
            
            const MOVIMIENTO_POR_CLICK = 33.333; // Una columna en escritorio
            
            let posicionActual = proyectos.length * 33.333; // Empezamos en el primer grupo real
            const totalProyectosReales = proyectos.length;
            
            let isTransitioning = false;

            // Función para crear las columnas de proyectos
            function crearCarrusel() {
                track.innerHTML = '';
                
                proyectosTotales.forEach((proj) => {
                    const columna = document.createElement('div');
                    columna.className = 'proyecto-columna';

                    const img = document.createElement('img');
                    img.className = 'imagen-fondo';
                    img.src = proj.imagen || 'https://via.placeholder.com/800x1200/1a1a2e/ffffff?text=PROYECTO';
                    img.alt = proj.titulo;
                    img.loading = 'lazy';
                    
                    // Manejamos error de carga de imagen
                    img.onerror = function() {
                        this.src = 'https://via.placeholder.com/800x1200/1a1a2e/ffffff?text=' + encodeURIComponent(proj.titulo);
                    };

                    const overlay = document.createElement('div');
                    overlay.className = 'overlay-contraste';

                    const contenido = document.createElement('div');
                    contenido.className = 'contenido-superpuesto';

                    const titulo = document.createElement('h2');
                    titulo.textContent = proj.titulo;

                    const subtitulo = document.createElement('p');
                    subtitulo.textContent = proj.subtitulo;

                    const boton = document.createElement('a');
                    boton.className = 'boton-flotante';
                    boton.href = proj.url;
                    boton.textContent = 'ver proyecto';

                    if (proj.url === '#') {
                        boton.addEventListener('click', (e) => {
                            e.preventDefault();
                            alert(`✨ "${proj.titulo}" — demo interactiva (personaliza el enlace)`);
                        });
                    } else {
                        boton.target = '_blank';
                        boton.rel = 'noopener noreferrer';
                    }

                    contenido.appendChild(titulo);
                    contenido.appendChild(subtitulo);
                    contenido.appendChild(boton);

                    columna.appendChild(img);
                    columna.appendChild(overlay);
                    columna.appendChild(contenido);

                    track.appendChild(columna);
                });

                crearIndicadores();
                actualizarCarrusel(false);
            }

            // Crear puntos indicadores - UNO POR CADA PROYECTO REAL
            function crearIndicadores() {
                indicadoresContainer.innerHTML = '';
                
                for (let i = 0; i < totalProyectosReales; i++) {
                    const indicador = document.createElement('div');
                    indicador.className = 'indicador';
                    if (i === 0) indicador.classList.add('activo');
                    
                    indicador.addEventListener('click', () => {
                        if (isTransitioning) return;
                        // En móvil cada proyecto ocupa 100%, en escritorio 33.333%
                        if (window.innerWidth <= 700) {
                            posicionActual = (i + totalProyectosReales) * 100;
                        } else {
                            posicionActual = (i + totalProyectosReales) * 33.333;
                        }
                        actualizarCarrusel();
                    });
                    
                    indicadoresContainer.appendChild(indicador);
                }
            }

            // Actualizar posición del carrusel
            function actualizarCarrusel(transition = true) {
                if (isTransitioning && transition) return;
                
                if (!transition) {
                    track.style.transition = 'none';
                } else {
                    track.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1)';
                    isTransitioning = true;
                }
                
                track.style.transform = `translateX(-${posicionActual}%)`;
                
                // Calcular qué proyecto está visible (primera columna)
                let paso = (window.innerWidth <= 700) ? 100 : 33.333;
                const proyectoVisible = Math.floor((posicionActual / paso) - totalProyectosReales + 0.1);
                let indiceProyecto = ((proyectoVisible % totalProyectosReales) + totalProyectosReales) % totalProyectosReales;
                
                document.querySelectorAll('.indicador').forEach((ind, i) => {
                    if (i === indiceProyecto) {
                        ind.classList.add('activo');
                    } else {
                        ind.classList.remove('activo');
                    }
                });
                
                // Lógica para el loop infinito
                if (transition) {
                    setTimeout(() => {
                        track.style.transition = 'none';
                        
                        let limite = totalProyectosReales * 2 * paso;
                        let ajuste = totalProyectosReales * paso;
                        
                        // Si nos pasamos por la derecha
                        if (posicionActual >= limite) {
                            posicionActual = posicionActual - ajuste;
                        }
                        // Si nos pasamos por la izquierda
                        else if (posicionActual < totalProyectosReales * paso) {
                            posicionActual = posicionActual + ajuste;
                        }
                        
                        track.style.transform = `translateX(-${posicionActual}%)`;
                        isTransitioning = false;
                    }, 600);
                } else {
                    isTransitioning = false;
                }
            }

            // Función para manejar el movimiento (adaptado a móvil/escritorio)
            function moverIzquierda() {
                if (isTransitioning) return;
                let paso = (window.innerWidth <= 700) ? 100 : MOVIMIENTO_POR_CLICK;
                posicionActual -= paso;
                actualizarCarrusel();
            }
            
            function moverDerecha() {
                if (isTransitioning) return;
                let paso = (window.innerWidth <= 700) ? 100 : MOVIMIENTO_POR_CLICK;
                posicionActual += paso;
                actualizarCarrusel();
            }

            // Eventos de navegación
            if (flechaIzq) flechaIzq.addEventListener('click', moverIzquierda);
            if (flechaDer) flechaDer.addEventListener('click', moverDerecha);

            // Navegación con teclado
            document.addEventListener('keydown', (e) => {
                if (isTransitioning) return;
                if (e.key === 'ArrowLeft') {
                    moverIzquierda();
                } else if (e.key === 'ArrowRight') {
                    moverDerecha();
                }
            });

            // Recalcular en resize para mantener proporciones
            window.addEventListener('resize', function() {
                // Ajustamos la posición actual para que tenga sentido con el nuevo ancho
                let paso = (window.innerWidth <= 700) ? 100 : 33.333;
                // Recalculamos la posición para que apunte al mismo proyecto real
                let indiceActual = Math.floor((posicionActual / (window.innerWidth <= 700 ? 100 : 33.333)) - totalProyectosReales + 0.5);
                indiceActual = ((indiceActual % totalProyectosReales) + totalProyectosReales) % totalProyectosReales;
                posicionActual = (indiceActual + totalProyectosReales) * paso;
                actualizarCarrusel(false);
            });

            // Iniciar
            crearCarrusel();

            // Móvil: mostrar dock al tocar
            if ('ontouchstart' in window) {
                const triggerArea = document.querySelector('.dock-trigger-area');
                const dockContainer = document.querySelector('.dock-container');
                
                if (triggerArea && dockContainer) {
                    triggerArea.addEventListener('touchstart', function() {
                        dockContainer.style.opacity = '1';
                        dockContainer.style.transform = 'translateY(0)';
                        setTimeout(() => {
                            dockContainer.style.opacity = '';
                            dockContainer.style.transform = '';
                        }, 2000);
                    });
                }
            }
        })();
    </script>
</body>
</html>
