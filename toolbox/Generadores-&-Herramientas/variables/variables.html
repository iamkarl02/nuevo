<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Mobs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            padding: 10px;
            background: #f0f0f0;
            font-size: 14px;
        }
        
        h1, h2, h3, h4 {
            margin: 5px 0;
            color: #333;
        }
        
        button {
            padding: 5px 10px;
            margin: 3px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            position: relative;
        }
        button:hover::after {
    content: attr(title);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 5px 10px;
    border-radius: 3px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 1000;
    margin-bottom: 5px;
}

button:hover::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #333;
    margin-bottom: -5px;
}
        button:hover {
            background: #3a5a8a;
        }
        
        button.delete {
            background: #d9534f;
        }
        
        button.delete:hover {
            background: #c9302c;
        }
        
        button.add {
            background: #5cb85c;
        }
        
        button.add:hover {
            background: #4cae4c;
        }
        
        .controls {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
        }
        
        .top-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .variables-container {
            border: 1px solid #ccc;
            background: white;
            margin-bottom: 10px;
        }
        
        .variable {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 0;
        }
        .page-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
    padding: 10px;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 5px;
    justify-content: center;
}

.nav-btn {
    padding: 5px 15px;
    font-size: 13px;
    min-width: 80px;
}
        .variable:last-child {
            border-bottom: none;
        }
        
        .variable-header {
            padding: 8px;
            background: #e9ecef;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .variable-content {
            padding: 10px;
            display: none;
        }
        
        .variable-content.open {
            display: block;
        }
        
        .section {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
        }
        
        .row {
            margin: 5px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        label {
            min-width: 120px;
            font-weight: bold;
        }
        
        input, select {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            min-width: 150px;
            font-size: 13px;
        }
        
        .radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .letter-container {
            display: flex;
            gap: 3px;
            margin: 5px 0;
            flex-wrap: wrap;
        }
        
        .letter-box {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            text-align: center;
            min-width: 30px;
        }
        
        .color-option {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid #ccc;
            margin: 1px;
        }
        
        .color-picker {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin: 5px 0;
        }
        
        .item-section {
            margin: 5px 0;
            padding: 5px;
            border: 1px solid #eee;
        }
        
        .enchantment, .effect {
            display: flex;
            gap: 5px;
            margin: 3px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .variable-header::after {
    content: '▼';
    font-size: 10px;
    transition: transform 0.3s;
    margin-left: 5px;
}

.variable-header.expanded::after {
    transform: rotate(180deg);
}
        .enchantment input, .effect input {
            min-width: 100px;
        }
        
        .mob-sections {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .mob-section {
            flex: 1;
            min-width: 280px;
        }
        
        .status-badge {
            padding: 2px 6px;
            background: #6c757d;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 5px;
        }
        
        .status-badge.yes {
            background: #5cb85c;
        }
        
        .status-badge.no {
            background: #d9534f;
        }
        
        .delete-variable-btn {
            background: #d9534f;
            padding: 3px 6px;
            font-size: 11px;
        }
        
        .page-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        
        .page-info {
            font-size: 13px;
            color: #666;
        }
        
        .nav-btn {
            padding: 3px 8px;
            font-size: 12px;
        }
        
        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .config-text {
            color: #666;
            font-size: 11px;
            margin-left: 5px;
        }
        
        .leather-color-section {
            margin-top: 5px;
            padding: 5px;
            background: #f8f9fa;
            border: 1px dashed #ddd;
            border-radius: 3px;
        }
        
        .color-preview-box {
            width: 25px;
            height: 25px;
            border: 1px solid #ccc;
            border-radius: 3px;
            margin-left: 5px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 5px 0;
        }
        
        .creeper-options {
            margin-top: 10px;
            padding: 10px;
            background: #e8f4fd;
            border: 1px solid #b8daff;
            border-radius: 3px;
        }
        
        .mob-type-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
        }
        
        .mob-option-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 5px;
                font-size: 12px;
            }
            
            label {
                min-width: 100px;
                font-size: 12px;
            }
            
            input, select {
                min-width: 120px;
                font-size: 12px;
            }
            
            .mob-section {
                min-width: 100%;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 3px;
            }
            
            .enchantment, .effect {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .enchantment input, .effect input {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editor de Mobs</h1>
        
        <div class="top-buttons">
<button id="export-config" title="Exportar configuración como JSON">Exportar Config</button>
<button id="import-config" title="Importar configuración desde JSON">Importar Config</button>
<button id="download-config" title="Descargar archivo .mcfunction">Descargar .mcfunction</button>
        </div>
        
        <div class="controls">
            <div class="row">
                <button id="add-variable">Añadir Variable</button>
                <span id="variable-count">Variables: 1/100</span>
            </div>
        </div>
        
        <div id="variables-container" class="variables-container">
            <!-- Las variables se generarán aquí dinámicamente -->
        </div>
        
        <div class="page-controls">
            <button id="prev-page" class="nav-btn">Anterior</button>
            <span class="page-info" id="page-info">Página 1 de 1</span>
            <button id="next-page" class="nav-btn">Siguiente</button>
        </div>
    </div>

    <script>
        // Diccionario de abreviaturas para mobs de Minecraft 1.21.1
        const mobAbbreviations = {
            // Hostiles
            'zombie': 'zb',
            'skeleton': 'sk',
            'creeper': 'cr',
            'spider': 'sp',
            'enderman': 'em',
            'witch': 'wt',
            'slime': 'sl',
            'phantom': 'ph',
            'drowned': 'dr',
            'husk': 'hs',
            'stray': 'st',
            'wither_skeleton': 'ws',
            'piglin': 'pg',
            'piglin_brute': 'pb',
            'zombified_piglin': 'zp',
            'ghast': 'gh',
            'blaze': 'bz',
            'magma_cube': 'mc',
            'wither': 'wr',
            'ender_dragon': 'ed',
            'warden': 'wn',
            'evoker': 'ev',
            'vindicator': 'vd',
            'pillager': 'pl',
            'ravager': 'rv',
            'vex': 'vx',
            'guardian': 'gd',
            'elder_guardian': 'eg',
            'shulker': 'sh',
            'silverfish': 'sf',
            'endermite': 'em',
            'cave_spider': 'cs',
            'bee': 'be',
            'hoglin': 'hg',
            'zoglin': 'zg',
            
            // Pasivos
            'pig': 'pg',
            'sheep': 'sh',
            'cow': 'cw',
            'chicken': 'ck',
            'wolf': 'wf',
            'cat': 'ct',
            'horse': 'hr',
            'donkey': 'dy',
            'mule': 'ml',
            'llama': 'lm',
            'trader_llama': 'tl',
            'fox': 'fx',
            'panda': 'pd',
            'polar_bear': 'pb',
            'rabbit': 'rb',
            'turtle': 'tt',
            'bat': 'bt',
            'parrot': 'pr',
            'mooshroom': 'mr',
            'squid': 'sq',
            'glow_squid': 'gs',
            'dolphin': 'dp',
            'tropical_fish': 'tf',
            'cod': 'cd',
            'salmon': 'sm',
            'pufferfish': 'pf',
            'axolotl': 'ax',
            'goat': 'gt',
            'frog': 'fg',
            'tadpole': 'tp',
            'allay': 'al',
            'sniffer': 'sn',
            'camel': 'cm',
            'armadillo': 'ar',
            'villager': 'vl',
            'wandering_trader': 'wt',
            'iron_golem': 'ig',
            'snow_golem': 'sg'
        };

        // Colores predefinidos
        const predefinedColors = [
            '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF',
            '#FFA500', '#800080', '#008000', '#800000', '#000080', '#808080',
            '#A52A2A', '#D2691E', '#DC143C', '#FF1493', '#FFD700', '#ADFF2F',
            '#7CFC00', '#20B2AA', '#1E90FF', '#8A2BE2', '#000000', '#FFFFFF'
        ];

// Variables globales
let variables = [];
let nextVariableId = 1;
let currentPage = 1;
const itemsPerPage = 5;
let updateTimeout = null;
let hasUnsavedChanges = false; // <-- AÑADIR ESTA LÍNEA

        // Función para obtener abreviatura de mob
        function getMobAbbreviation(mobName) {
            const normalized = mobName.toLowerCase().trim();
            return mobAbbreviations[normalized] || normalized.substring(0, 2).toLowerCase();
        }

        // Función para convertir decimal a hexadecimal
        function decimalToHex(decimal) {
            if (typeof decimal === 'string' && decimal.startsWith('#')) {
                return decimal;
            }
            
            const num = parseInt(decimal);
            if (isNaN(num)) return '#A06540';
            
            const clamped = Math.max(0, Math.min(16777215, num));
            const hex = clamped.toString(16).toUpperCase().padStart(6, '0');
            return '#' + hex;
        }

        // Función para convertir hexadecimal a decimal
        function hexToDecimal(hex) {
            if (!hex.startsWith('#')) return 21951;
            
            const hexNum = hex.substring(1);
            return parseInt(hexNum, 16);
        }

        // Clase para manejar cada variable
        class Variable {
            constructor(id) {
                this.id = id;
                this.isOpen = false;
                this.typeMob = 'skeleton';
                this.fileName = 'mob_config';
                this.mobName = 'Mob' + id;
                this.nameMode = 'junto';
                this.nameLetters = [];
                this.nameColor = '#FFFFFF';
                this.replace = 'no';
                this.mobCustom = 'no'; // IMPORTANTE: 'no' para simple por defecto
                this.viewDistance = 7;
                
                // Opciones especiales para creeper (quitados los límites max)
                this.creeperOptions = {
                    powerExplosion: 3,
                    explosionTime: 20,
                    powered: false
                };
                
                this.items = {
                    helmet: { name: '', enchantments: [], leatherColor: 21951 },
                    chestplate: { name: '', enchantments: [], leatherColor: 21951 },
                    leggings: { name: '', enchantments: [], leatherColor: 21951 },
                    boots: { name: '', enchantments: [], leatherColor: 21951 },
                    mainhand: { name: '', enchantments: [] },
                    offhand: { name: '', enchantments: [] }
                };
                this.effects = [];
                
                // Configurar mobTop y mobBottom POR DEFECTO para simple
                this.mobTop = this.createEmptyMobData();
                this.mobBottom = this.createEmptyMobData();
                
                // Por defecto: skeleton arriba, creeper abajo
                this.mobTop.typeMob = 'skeleton';
                this.mobTop.mobType = 'none'; // 'none' indica mob simple
                this.mobBottom.typeMob = 'creeper';
                this.mobBottom.mobType = 'none'; // 'none' indica mob simple
            }
            createEmptyMobData() {
                return {
                    typeMob: '',
                    mobName: 'Mob',
                    nameMode: 'junto',
                    nameLetters: [],
                    nameColor: '#FF0000',
                    mobType: 'none', // 'none' = solo mob, 'custom' = con items/efectos
                    viewDistance: 7, // NUEVO: Distancia de visión por defecto
                    items: {
                        helmet: { name: '', enchantments: [], leatherColor: 21951 },
                        chestplate: { name: '', enchantments: [], leatherColor: 21951 },
                        leggings: { name: '', enchantments: [], leatherColor: 21951 },
                        boots: { name: '', enchantments: [], leatherColor: 21951 },
                        mainhand: { name: '', enchantments: [] },
                        offhand: { name: '', enchantments: [] }
                    },
                    effects: [],
                    creeperOptions: {
                        powerExplosion: 3,
                        explosionTime: 20,
                        powered: false
                    }
                };
            }
            
            // Comprobar si un item es de cuero
            isLeatherItem(itemName) {
                return itemName && (
                    itemName.toLowerCase().includes('leather_') || 
                    itemName.toLowerCase().includes('cuero') ||
                    itemName.toLowerCase().includes('leather ') ||
                    itemName.toLowerCase() === 'leather_helmet' ||
                    itemName.toLowerCase() === 'leather_chestplate' ||
                    itemName.toLowerCase() === 'leather_leggings' ||
                    itemName.toLowerCase() === 'leather_boots'
                );
            }
            
            // Comprobar si es un creeper
            isCreeper(mobType) {
                const type = mobType || this.typeMob;
                return type.toLowerCase().includes('creeper');
            }
            
            // Obtener abreviatura del mob
            getAbbreviation(mobType) {
                const type = mobType || this.typeMob;
                return getMobAbbreviation(type);
            }
        }

        // Inicializar con una variable por defecto
        function initialize() {
            addVariable();
            updateNavigation();
        }

        // Añadir una nueva variable
        function addVariable() {
            if (variables.length >= 100) return;
            
            const variable = new Variable(nextVariableId++);
            variables.push(variable);
            updateVariableCount();
            updateNavigation();
            renderVariables();
        }
// Función para actualizar indicador de cambios no guardados
function updateSaveIndicator() {
    const title = document.title;
    if (hasUnsavedChanges && !title.startsWith('* ')) {
        document.title = '* ' + document.title;
    } else if (!hasUnsavedChanges && title.startsWith('* ')) {
        document.title = title.substring(2);
    }
}
        // Eliminar una variable específica
        function removeVariable(variableId) {
            if (variables.length <= 1) return;
            
            const index = variables.findIndex(v => v.id === variableId);
            if (index !== -1) {
                variables.splice(index, 1);
                updateVariableCount();
                updateNavigation();
                renderVariables();
            }
        }

        // Actualizar el contador de variables
        function updateVariableCount() {
            document.getElementById('variable-count').textContent = `Variables: ${variables.length}/100`;
        }

        // Actualizar navegación
        function updateNavigation() {
            const totalPages = Math.max(1, Math.ceil(variables.length / itemsPerPage));
            currentPage = Math.min(currentPage, totalPages);
            
            document.getElementById('page-info').textContent = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prev-page').disabled = currentPage === 1;
            document.getElementById('next-page').disabled = currentPage === totalPages || totalPages === 0;
            
            if (getCurrentPageVariables().length === 0 && currentPage > 1) {
                currentPage--;
                updateNavigation();
            }
        }

        // Obtener variables para la página actual
        function getCurrentPageVariables() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            return variables.slice(startIndex, endIndex);
        }

        // Renderizar variables de la página actual
        function renderVariables() {
            const container = document.getElementById('variables-container');
            container.innerHTML = '';
            
            const pageVariables = getCurrentPageVariables();
            
            pageVariables.forEach((variable, index) => {
                const variableElement = createVariableElement(variable, index);
                container.appendChild(variableElement);
            });
            
            if (pageVariables.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No hay variables</div>';
            }
        }

        // Crear el elemento HTML para una variable
        function createVariableElement(variable, localIndex) {
            const globalIndex = (currentPage - 1) * itemsPerPage + localIndex;
            const div = document.createElement('div');
            div.className = 'variable';
            div.id = `variable-${variable.id}`;
            
            let configText = '';
            if (variable.replace === 'si') {
                if (variable.mobCustom === 'si') {
                    configText = 'Custom (con items/efectos)';
                } else {
                    configText = 'Simple (solo el mob)';
                }
            } else {
                configText = 'Nombre normal';
            }
            
            div.innerHTML = `
                <div class="variable-header" onclick="toggleVariable(${variable.id})">
                    <div>
                        <strong>Variable ${globalIndex + 1}</strong>
                        <span class="status-badge ${variable.replace === 'si' ? 'yes' : 'no'}">Reemplazar: ${variable.replace === 'si' ? 'Sí' : 'No'}</span>
                        <span class="config-text">${configText}</span>
                    </div>
                    <div>
                        <button class="delete-variable-btn" onclick="event.stopPropagation(); removeVariable(${variable.id})">Eliminar</button>
                    </div>
                </div>
                <div class="variable-content ${variable.isOpen ? 'open' : ''}" id="content-${variable.id}">
                    ${createVariableContent(variable, globalIndex)}
                </div>
            `;
            
            return div;
        }

        // Crear el contenido de una variable
// Crear el contenido de una variable - CORREGIDO
// Crear el contenido de una variable - CORREGIDO
function createVariableContent(variable, index) {
    const showNormalContent = variable.replace === 'no';
    const showCustomReplacement = variable.replace === 'si' && variable.mobCustom === 'si';
    const showSimpleReplacement = variable.replace === 'si' && variable.mobCustom === 'no';
    
    let content = `
        <div class="section">
            <h4>Configuración Global</h4>
            <div class="row">
                <label>Tipo Mob:</label>
                <input type="text" value="${variable.typeMob}" 
                       onchange="queueUpdate(${variable.id}, 'typeMob', this.value)" 
                       oninput="queueSyncGlobal('typeMob', this.value)">
            </div>
            <div class="row">
                <label>Nombre archivo:</label>
                <input type="text" value="${variable.fileName}" 
                       onchange="queueUpdate(${variable.id}, 'fileName', this.value)"
                       oninput="queueSyncGlobal('fileName', this.value)">
            </div>
        </div>
    `;
    
    // Opciones especiales para creeper global (SOLO si es mob normal)
    if (variable.isCreeper() && variable.replace === 'no') {
        content += `
            <div class="creeper-options">
                <h4>Opciones de Creeper Global</h4>
                <div class="row">
                    <label>Power explosión:</label>
                    <input type="number" value="${variable.creeperOptions.powerExplosion}" min="0"
                           onchange="queueUpdateCreeperOption(${variable.id}, 'powerExplosion', this.value)">
                </div>
                <div class="row">
                    <label>Ticks explosión:</label>
                    <input type="number" value="${variable.creeperOptions.explosionTime}" min="0"
                           onchange="queueUpdateCreeperOption(${variable.id}, 'explosionTime', this.value)">
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" id="powered-${variable.id}" 
                           ${variable.creeperOptions.powered ? 'checked' : ''}
                           onchange="queueUpdateCreeperOption(${variable.id}, 'powered', this.checked)">
                    <label for="powered-${variable.id}">Eléctrico (powered)</label>
                </div>
            </div>
        `;
    }
    
    content += `
        <div class="section">
            <h4>Reemplazar</h4>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="replace-${variable.id}" 
                           value="no" ${variable.replace === 'no' ? 'checked' : ''}
                           onchange="queueUpdate(${variable.id}, 'replace', this.value); delayedRender()">
                    <label>No</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="replace-${variable.id}" 
                           value="si" ${variable.replace === 'si' ? 'checked' : ''}
                           onchange="queueUpdate(${variable.id}, 'replace', this.value); delayedRender()">
                    <label>Sí</label>
                </div>
            </div>
        </div>
    `;
    
    if (variable.replace === 'si') {
        content += `
            <div class="section">
                <h4>Configuración de Reemplazo</h4>
                <div class="row">
                    <label>Mob custom:</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="mob-custom-${variable.id}" 
                                   value="no" ${variable.mobCustom === 'no' ? 'checked' : ''}
                                   onchange="queueUpdate(${variable.id}, 'mobCustom', this.value); delayedRender()">
                            <label>Simple (solo el mob)</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="mob-custom-${variable.id}" 
                                   value="si" ${variable.mobCustom === 'si' ? 'checked' : ''}
                                   onchange="queueUpdate(${variable.id}, 'mobCustom', this.value); delayedRender()">
                            <label>Custom (con items/efectos)</label>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    if (showNormalContent) {
        content += createMobNameSection(variable, 'normal');

// ============================================
// FUNCIÓN PARA GENERAR COMANDO DE ITEM EN .MCFUNCTION - CORREGIDA
// ============================================

function generateItemMcfunctionCommand(entityTag, listTag, slot, item, mobData) {
    if (!item || !item.name || item.name.trim() === '') {
        return '';
    }
    
    let command = `item replace entity @e[tag=${entityTag},tag=!${listTag}] ${slot} with minecraft:${item.name.trim()}[`;
    
    // Custom model data - SIEMPRE primero
    command += `minecraft:custom_model_data=100`;
    
    // Determinar si es item de cuero
    const itemNameLower = item.name.toLowerCase().trim();
    const isLeather = itemNameLower.includes('leather_') || 
                      itemNameLower === 'leather_helmet' ||
                      itemNameLower === 'leather_chestplate' ||
                      itemNameLower === 'leather_leggings' ||
                      itemNameLower === 'leather_boots';
    
    // Color para cuero
    if (isLeather && item.leatherColor !== undefined) {
        command += `,minecraft:dyed_color={rgb:${item.leatherColor},show_in_tooltip:true}`;
    }
    
    // Encantamientos
    if (item.enchantments && item.enchantments.length > 0) {
        const validEnchants = item.enchantments.filter(e => e.name && e.name.trim() !== '');
        if (validEnchants.length > 0) {
            const enchants = validEnchants.map(e => `${e.name.trim()}:${e.level || 1}`).join(',');
            command += `,minecraft:enchantments={${enchants}}`;
        } else {
            command += `,minecraft:enchantments={}`;
        }
    } else {
        command += `,minecraft:enchantments={}`;
    }
    
    // Unbreakable - SIEMPRE al final
    command += `,minecraft:unbreakable={}`;
    
    command += ']\n';
    
    return command;
}

// ============================================
// FUNCIÓN PARA GENERAR CONTENIDO .MCFUNCTION PRINCIPAL - CORREGIDA
// ============================================

function generateMCFunctionContent() {
    if (variables.length === 0) {
        return "# No hay variables configuradas\n";
    }
    
    let content = '';
    
    try {
        // Obtener el mob base de la primera variable
        const baseMob = variables[0].typeMob || 'zombie';
        const baseMobLower = baseMob.toLowerCase();
        const abbr = getMobAbbreviation(baseMobLower);
        
        // ============ SECCIÓN 1: SCOREBOARD Y TAGS INICIALES ============
        content += `scoreboard objectives add c${abbr} dummy\n\n`;
        content += `tag @e[type=${baseMobLower},tag=!${abbr},tag=!${abbr}r] add ${abbr}\n\n`;
        content += `scoreboard players add c${abbr} c${abbr} 1\n\n`;
        
        // ============ SECCIÓN 2: EXECUTE IF SCORE PARA CADA VARIABLE ============
        // Generar lista de exclusiones dinámicamente
        let exclusionTags = '';
        for (let i = 1; i <= variables.length; i++) {
            exclusionTags += `tag=!${abbr}c${i},`;
        }
        exclusionTags += `tag=!${abbr}r`;
        
        variables.forEach((variable, index) => {
            const varNum = index + 1;
            content += `execute if score c${abbr} c${abbr} matches ${varNum} as @e[tag=${abbr},${exclusionTags},limit=1,sort=random] run tag @s add ${abbr}c${varNum}\n`;
        });
        
        content += '\n';
        
        // ============ SECCIÓN 3: CONTENIDO PARA CADA VARIABLE ============
        variables.forEach((variable, index) => {
            content += generateVariableMcfunctionContent(variable, index + 1, abbr);
        });
        
        // ============ SECCIÓN 4: RESET SCOREBOARD ============
        content += `\nexecute if score c${abbr} c${abbr} matches ${variables.length}.. run scoreboard players reset c${abbr}\n\n`;
        
        // ============ SECCIÓN 5: COMANDOS DE LIMPIEZA ============
        content += `# Elimina cualquier item soltado por el mob.\n`;
        content += `clear @a *[minecraft:custom_model_data=100]\n`;
        content += `kill @e[type=item,nbt={Item:{components:{"minecraft:custom_model_data":100}}}]\n`;
    } catch (error) {
        console.error('Error grave generando .mcfunction:', error);
        content += `# ERROR GRAVE: ${error.message}\n`;
    }
    
    return content;
}
// ============================================
// FUNCIÓN PARA GENERAR CONTENIDO DE VARIABLE EN .MCFUNCTION
// ============================================
function generateVariableMcfunctionContent(variable, varNum, baseAbbr) {
    let content = `\n# ${variable.typeMob || 'mob'} custom ${varNum}\n`;
    const tag = `${baseAbbr}c${varNum}`;
    const listTag = `${tag}l`;
    
    try {
        // ============ CASO 1: MOB NORMAL (NO REEMPLAZADO) ============
        if (variable.replace === 'no') {
            const isCreeper = variable.typeMob && variable.typeMob.toLowerCase().includes('creeper');
            content += generateNormalMobMcfunctionContent(variable, tag, listTag, isCreeper);
        }
        // ============ CASO 2: MOB REEMPLAZADO ============
        else if (variable.replace === 'si') {
            // Sub-caso 2A: Reemplazo SIMPLE (solo mob)
            if (variable.mobCustom === 'no') {
                content += generateSimpleReplacementMcfunction(variable, tag, varNum, baseAbbr);
            }
            // Sub-caso 2B: Reemplazo CON CUSTOM
            else if (variable.mobCustom === 'si') {
                content += generateCustomReplacementMcfunction(variable, tag, varNum, baseAbbr);
            }
        }
    } catch (error) {
        console.error(`Error generando variable ${varNum}:`, error);
        content += `# ERROR generando esta variable: ${error.message}\n`;
    }
    
    return content;
}

        // ============================================
        // FUNCIÓN PARA MOB NORMAL (NO REEMPLAZADO) EN .MCFUNCTION
        // ============================================

        function generateNormalMobMcfunctionContent(variable, tag, listTag, isCreeper) {
            let content = '';
            
            // ============ ITEMS ============
            const items = variable.items;
            const itemCommands = [];
            
            // Mainhand
            if (items.mainhand.name && items.mainhand.name.trim() !== '') {
                itemCommands.push(generateItemMcfunctionCommand(tag, listTag, 'weapon.mainhand', items.mainhand, variable));
            }
            
            // Offhand
            if (items.offhand.name && items.offhand.name.trim() !== '') {
                itemCommands.push(generateItemMcfunctionCommand(tag, listTag, 'weapon.offhand', items.offhand, variable));
            }
            
            // Armadura
            const armorSlots = [
                { slot: 'armor.head', item: items.helmet },
                { slot: 'armor.chest', item: items.chestplate },
                { slot: 'armor.legs', item: items.leggings },
                { slot: 'armor.feet', item: items.boots }
            ];
            
            armorSlots.forEach(armor => {
                if (armor.item.name && armor.item.name.trim() !== '') {
                    itemCommands.push(generateItemMcfunctionCommand(tag, listTag, armor.slot, armor.item, variable));
                }
            });
            
            content += itemCommands.join('');
            if (itemCommands.length > 0) content += '\n';
            
            // ============ NOMBRE ============
            if (variable.mobName && variable.mobName.trim() !== '' && variable.mobName !== 'Mob' + variable.id) {
                const nameJSON = generateNameJSON(variable);
                const targetTag = isCreeper ? tag : `${tag},tag=!${listTag}`;
                content += `execute as @e[tag=${targetTag}] run data merge entity @s {CustomName:'${nameJSON}',CustomNameVisible:1b}\n`;
                
                // NUEVO: Añadir comandos de distancia de visión si hay nombre
                const viewDistance = variable.viewDistance || 7;
                // CORREGIDO: Quitar tag de listo en los comandos de distancia
                content += `execute as @e[tag=${tag}] at @s unless entity @a[distance=..${viewDistance}] run data merge entity @s {CustomNameVisible:0b}\n`;
                content += `execute as @e[tag=${tag}] at @s if entity @a[distance=..${viewDistance}] run data merge entity @s {CustomNameVisible:1b}\n\n`;
            } else {
                content += '\n';
            }
            
            // ============ EFECTOS ============
            if (variable.effects && variable.effects.length > 0) {
                variable.effects.forEach(effect => {
                    if (effect.name && effect.name.trim() !== '') {
                        let duration = effect.duration || 'infinite';
                        let amplifier = effect.amplifier || 1;
                        
                        // Para creeper, convertir infinite a 1 1
                        if (isCreeper && duration === 'infinite') {
                            duration = '1';
                            amplifier = '1';
                        }
                        
                        const targetTag = isCreeper ? tag : `${tag},tag=!${listTag}`;
                        content += `effect give @e[tag=${targetTag}] ${effect.name} ${duration} ${amplifier}\n`;
                    }
                });
                if (variable.effects.length > 0) content += '\n';
            }
            
            // ============ OPCIONES DE CREEPER ============
            if (isCreeper) {
                const powered = variable.creeperOptions?.powered ? '1b' : '0b';
                const fuse = variable.creeperOptions?.explosionTime || 30;
                const radius = variable.creeperOptions?.powerExplosion || 3;
                // CORREGIDO: Aplicar opciones solo a creepers sin tag de listo y luego añadir tag
                content += `execute as @e[tag=${tag},tag=!${listTag}] run data merge entity @s {powered:${powered},Fuse:${fuse},ExplosionRadius:${radius}}\n`;
                content += `tag @e[tag=${tag},tag=!${listTag}] add ${listTag}\n\n`;
            } else {
                // ============ TAG DE LISTO (para mobs no-creeper) ============
                content += `tag @e[tag=${tag},tag=!${listTag}] add ${listTag}\n`;
            }
            
            return content;
        }

function generateCustomReplacementMcfunction(variable, tag, varNum, baseAbbr) {
    let content = '';
    const topMob = variable.mobTop;
    const bottomMob = variable.mobBottom;
    
    content += `execute as @e[tag=${tag}] run data merge entity @s {DeathLootTable:""}\n`;
    
    // Verificar si los mobs tienen contenido custom
    const topHasContent = hasCustomContent(topMob);
    const bottomHasContent = hasCustomContent(bottomMob);
    
    if (!topHasContent && !bottomHasContent) {
        // Si no hay contenido custom, solo crear mobs simples
        if (topMob.typeMob && topMob.typeMob.trim() !== '') {
            const topAbbr = getMobAbbreviation(topMob.typeMob);
            content += `execute as @e[tag=${tag}] at @s run summon ${topMob.typeMob} ~ ~ ~ {Tags:["${topAbbr}r","${topAbbr}1r${varNum}"]}\n`;
            content += generateSimpleMobNameAndDistance(topMob, 1, varNum);
        }
        if (bottomMob.typeMob && bottomMob.typeMob.trim() !== '') {
            const bottomAbbr = getMobAbbreviation(bottomMob.typeMob);
            content += `execute as @e[tag=${tag}] at @s run summon ${bottomMob.typeMob} ~ ~ ~ {Tags:["${bottomAbbr}r","${bottomAbbr}1r${varNum}"]}\n`;
            content += generateSimpleMobNameAndDistance(bottomMob, 1, varNum);
        }
    } else {
        // Si hay contenido custom
        if (topHasContent && bottomHasContent) {
            // Ambos mobs tienen custom
            const topAbbr = getMobAbbreviation(topMob.typeMob);
            const bottomAbbr = getMobAbbreviation(bottomMob.typeMob);
            content += `execute as @e[tag=${tag}] at @s run summon ${topMob.typeMob} ~ ~ ~ {Tags:["${topAbbr}r","${topAbbr}1r${varNum}"],Passengers:[{id:"minecraft:${bottomMob.typeMob}",Tags:["${bottomAbbr}r","${bottomAbbr}2r${varNum}"]}]}\n`;
            
            // Generar contenido custom para ambos
            content += generateReplacedMobCustomMcfunctionContent(topMob, 1, varNum);
            content += generateReplacedMobCustomMcfunctionContent(bottomMob, 2, varNum);
            
        } else if (topHasContent) {
            // Solo top tiene custom
            const topAbbr = getMobAbbreviation(topMob.typeMob);
            content += `execute as @e[tag=${tag}] at @s run summon ${topMob.typeMob} ~ ~ ~ {Tags:["${topAbbr}r","${topAbbr}1r${varNum}"]}\n`;
            content += generateReplacedMobCustomMcfunctionContent(topMob, 1, varNum);
            
        } else if (bottomHasContent) {
            // Solo bottom tiene custom
            const bottomAbbr = getMobAbbreviation(bottomMob.typeMob);
            content += `execute as @e[tag=${tag}] at @s run summon ${bottomMob.typeMob} ~ ~ ~ {Tags:["${bottomAbbr}r","${bottomAbbr}1r${varNum}"]}\n`;
            content += generateReplacedMobCustomMcfunctionContent(bottomMob, 1, varNum);
        }
    }
    
    content += `kill @e[tag=${tag}]\n`;
    
    return content;
}

// ============================================
// FUNCIÓN AUXILIAR: Verificar si mob tiene contenido custom
// ============================================

function hasCustomContent(mobData) {
    if (!mobData.typeMob || mobData.typeMob.trim() === '') {
        return false;
    }
    
    // Si tiene mobType custom
    if (mobData.mobType === 'custom') {
        return true;
    }
    
    // Si tiene items configurados
    const hasItems = mobData.items && Object.values(mobData.items).some(item => 
        item.name && item.name.trim() !== ''
    );
    
    // Si tiene efectos configurados
    const hasEffects = mobData.effects && mobData.effects.length > 0;
    
    // Si tiene nombre personalizado
    const hasCustomName = mobData.mobName && mobData.mobName.trim() !== '' && 
                         mobData.mobName !== 'Mob';
    
    // Si es creeper y tiene opciones configuradas
    const isCreeper = mobData.typeMob && mobData.typeMob.toLowerCase().includes('creeper');
    const hasCreeperOptions = isCreeper && mobData.creeperOptions && (
        mobData.creeperOptions.powerExplosion !== 3 ||
        mobData.creeperOptions.explosionTime !== 20 ||
        mobData.creeperOptions.powered !== false
    );
    
    return hasItems || hasEffects || hasCustomName || hasCreeperOptions;
}

function generateReplacedMobCustomMcfunctionContent(mobData, position, varNum) {
    if (!mobData.typeMob || mobData.typeMob.trim() === '') {
        return '';
    }
    
    let content = '';
    const mobAbbr = getMobAbbreviation(mobData.typeMob);
    const tag = `${mobAbbr}${position}r${varNum}`;
    const listTag = `${tag}l`;
    const isCreeper = mobData.typeMob.toLowerCase().includes('creeper');
    
    // ============ ITEMS ============
    const items = mobData.items;
    const itemCommands = [];
    
    // Mainhand
    if (items.mainhand.name && items.mainhand.name.trim() !== '') {
        itemCommands.push(generateItemMcfunctionCommand(tag, listTag, 'weapon.mainhand', items.mainhand, mobData));
    }
    
    // Offhand
    if (items.offhand.name && items.offhand.name.trim() !== '') {
        itemCommands.push(generateItemMcfunctionCommand(tag, listTag, 'weapon.offhand', items.offhand, mobData));
    }
    
    // Armadura
    const armorSlots = [
        { slot: 'armor.head', item: items.helmet },
        { slot: 'armor.chest', item: items.chestplate },
        { slot: 'armor.legs', item: items.leggings },
        { slot: 'armor.feet', item: items.boots }
    ];
    
    armorSlots.forEach(armor => {
        if (armor.item.name && armor.item.name.trim() !== '') {
            itemCommands.push(generateItemMcfunctionCommand(tag, listTag, armor.slot, armor.item, mobData));
        }
    });
    
    content += itemCommands.join('');
    if (itemCommands.length > 0) content += '\n';
    
    // ============ NOMBRE ============
    if (mobData.mobName && mobData.mobName.trim() !== '' && mobData.mobName !== 'Mob') {
        let nameJSON = '';
        if (mobData.nameMode === 'junto') {
            nameJSON = `[{"text":"${mobData.mobName}","color":"${mobData.nameColor}"}]`;
        } else {
            const letters = mobData.nameLetters && mobData.nameLetters.length > 0 ? 
                mobData.nameLetters : 
                mobData.mobName.split('').map(letter => ({ letter, color: '#FFFFFF' }));
            const parts = letters.map(letter => `{"text":"${letter.letter}","color":"${letter.color}"}`);
            nameJSON = `[${parts.join(',')}]`;
        }
        
        content += `execute as @e[tag=${tag}] run data merge entity @s {CustomName:'${nameJSON}',CustomNameVisible:1b}\n`;
        
        // Comandos de distancia de visión
        const viewDistance = mobData.viewDistance || 7;
        content += `execute as @e[tag=${tag}] at @s unless entity @a[distance=..${viewDistance}] run data merge entity @s {CustomNameVisible:0b}\n`;
        content += `execute as @e[tag=${tag}] at @s if entity @a[distance=..${viewDistance}] run data merge entity @s {CustomNameVisible:1b}\n\n`;
    } else {
        content += '\n';
    }
    
    // ============ EFECTOS ============
    if (mobData.effects && mobData.effects.length > 0) {
        mobData.effects.forEach(effect => {
            if (effect.name && effect.name.trim() !== '') {
                let duration = effect.duration || 'infinite';
                let amplifier = effect.amplifier || 1;
                
                if (isCreeper && duration === 'infinite') {
                    duration = '1';
                    amplifier = '1';
                }
                
                content += `effect give @e[tag=${tag},tag=!${listTag}] ${effect.name} ${duration} ${amplifier}\n`;
            }
        });
        if (mobData.effects.length > 0) content += '\n';
    }
    
    // ============ OPCIONES DE CREEPER ============
    if (isCreeper) {
        const powered = mobData.creeperOptions?.powered ? '1b' : '0b';
        const fuse = mobData.creeperOptions?.explosionTime || 30;
        const radius = mobData.creeperOptions?.powerExplosion || 3;
        
        // Solo aplicar si es diferente de los valores por defecto
        if (powered !== '0b' || fuse !== 30 || radius !== 3) {
            content += `execute as @e[tag=${tag},tag=!${listTag}] run data merge entity @s {powered:${powered},Fuse:${fuse},ExplosionRadius:${radius}}\n`;
        }
    }
    
    // ============ TAG DE LISTO ============
    content += `tag @e[tag=${tag},tag=!${listTag}] add ${listTag}\n\n`;
    
    return content;
}

// Función para importar configuración desde JSON
function importConfiguration(config) {
    try {
        // Validación básica del objeto
        if (!config || typeof config !== 'object') {
            throw new Error('El archivo no es un JSON válido');
        }
        
        // Validar que tenga variables
        if (!config.variables || !Array.isArray(config.variables)) {
            throw new Error('Formato de configuración inválido: No se encontró la propiedad "variables"');
        }
        
        // Validar que no exceda el límite
        if (config.variables.length > 100) {
            throw new Error(`Demasiadas variables (${config.variables.length}). El máximo permitido es 100.`);
        }
        
        // Validar versión (opcional, solo muestra advertencia)
        if (config.version && !config.version.startsWith('5.')) {
            const userConfirmed = confirm(
                `Este archivo fue exportado con la versión ${config.version || 'desconocida'}.\n` +
                `La versión actual es 5.0.\n\n` +
                `¿Deseas continuar? (Puede haber incompatibilidades)`
            );
            if (!userConfirmed) {
                console.log('Importación cancelada por el usuario');
                return;
            }
        }
        
        // Validar fecha de exportación (información adicional)
        if (config.exportDate) {
            console.log(`Importando configuración exportada el: ${new Date(config.exportDate).toLocaleString()}`);
        }
        
        // Resetear variables existentes
        const previousCount = variables.length;
        variables = [];
        nextVariableId = 1;
        
        // Procesar cada variable
        config.variables.forEach((varData, index) => {
            try {
                const variable = new Variable(nextVariableId++);
                
                // Copiar propiedades simples
                const simpleProperties = [
                    'typeMob', 'fileName', 'mobName', 'nameMode', 'nameColor',
                    'replace', 'mobCustom', 'viewDistance', 'isOpen'
                ];
                
                simpleProperties.forEach(prop => {
                    if (varData[prop] !== undefined) {
                        variable[prop] = varData[prop];
                    }
                });
                
                // Importar opciones de creeper (con valores por defecto si faltan)
                if (varData.creeperOptions) {
                    variable.creeperOptions = {
                        powerExplosion: typeof varData.creeperOptions.powerExplosion === 'number' 
                            ? Math.max(0, varData.creeperOptions.powerExplosion) 
                            : 3,
                        explosionTime: typeof varData.creeperOptions.explosionTime === 'number'
                            ? Math.max(0, varData.creeperOptions.explosionTime)
                            : 20,
                        powered: Boolean(varData.creeperOptions.powered)
                    };
                }
                
                // Importar nameLetters (con validación)
                if (varData.nameLetters && Array.isArray(varData.nameLetters)) {
                    variable.nameLetters = varData.nameLetters
                        .filter(letter => letter && typeof letter === 'object')
                        .map(letter => ({
                            letter: String(letter.letter || ''),
                            color: letter.color || '#FF0000'
                        }))
                        .filter(letter => letter.letter.length > 0);
                }
                
                // Importar items (con validación)
                if (varData.items && typeof varData.items === 'object') {
                    Object.keys(variable.items).forEach(itemKey => {
                        if (varData.items[itemKey]) {
                            const sourceItem = varData.items[itemKey];
                            
                            // Nombre del item
                            variable.items[itemKey].name = String(sourceItem.name || '');
                            
                            // Color de cuero (con validación numérica)
                            if (sourceItem.leatherColor !== undefined) {
                                const color = parseInt(sourceItem.leatherColor);
                                variable.items[itemKey].leatherColor = isNaN(color) ? 21951 
                                    : Math.max(0, Math.min(16777215, color));
                            }
                            
                            // Encantamientos
                            if (sourceItem.enchantments && Array.isArray(sourceItem.enchantments)) {
                                variable.items[itemKey].enchantments = sourceItem.enchantments
                                    .filter(enc => enc && typeof enc === 'object')
                                    .map(enc => ({
                                        name: String(enc.name || ''),
                                        level: typeof enc.level === 'number' ? Math.max(1, enc.level) : 1
                                    }))
                                    .filter(enc => enc.name.trim() !== '');
                            }
                        }
                    });
                }
                
                // Importar efectos (con validación)
                if (varData.effects && Array.isArray(varData.effects)) {
                    variable.effects = varData.effects
                        .filter(effect => effect && typeof effect === 'object')
                        .map(effect => ({
                            name: String(effect.name || ''),
                            duration: effect.duration === 'infinite' ? 'infinite' 
                                : (typeof effect.duration === 'string' || typeof effect.duration === 'number' 
                                    ? String(effect.duration) 
                                    : 'infinite'),
                            amplifier: typeof effect.amplifier === 'number' ? Math.max(0, effect.amplifier) : 1
                        }))
                        .filter(effect => effect.name.trim() !== '');
                }
                
                // Importar mobTop y mobBottom
                if (varData.mobTop && typeof varData.mobTop === 'object') {
                    variable.mobTop = importMobData(varData.mobTop);
                }
                
                if (varData.mobBottom && typeof varData.mobBottom === 'object') {
                    variable.mobBottom = importMobData(varData.mobBottom);
                }
                
                // Asegurar que mobTop y mobBottom tengan mobType si no existe
                if (!variable.mobTop.mobType) {
                    variable.mobTop.mobType = 'none';
                }
                if (!variable.mobBottom.mobType) {
                    variable.mobBottom.mobType = 'none';
                }
                
                // Mantener abierto por defecto para mejor UX
                variable.isOpen = true;
                
                variables.push(variable);
                
                console.log(`Variable ${index + 1} importada correctamente`);
                
            } catch (varError) {
                console.error(`Error importando variable ${index + 1}:`, varError);
                // Continuar con las siguientes variables
            }
        });
        
        // Si no se importó ninguna variable, crear una por defecto
        if (variables.length === 0) {
            console.warn('No se pudieron importar variables, creando una por defecto');
            addVariable();
        }
        
        // Actualizar la interfaz
        updateVariableCount();
        currentPage = 1;
        updateNavigation();
        renderVariables();
        
        // Resetear indicador de cambios no guardados
        hasUnsavedChanges = false;
        updateSaveIndicator();
        
        // Mostrar mensaje de éxito
        const successMessage = `Configuración importada correctamente.\n` +
                              `Variables importadas: ${variables.length}\n` +
                              (config.variables.length > variables.length 
                                ? `(${config.variables.length - variables.length} variables tuvieron errores)` 
                                : '');
        
        alert(successMessage);
        console.log('Importación completada exitosamente');
        
    } catch (error) {
        console.error('Error al importar configuración:', error);
        
        // Mensajes de error más amigables
        let errorMessage = 'Error al importar configuración: ';
        
        if (error.message.includes('JSON válido')) {
            errorMessage += 'El archivo debe ser un JSON válido exportado desde esta aplicación.';
        } else if (error.message.includes('variables')) {
            errorMessage += 'El archivo no tiene el formato correcto.';
        } else {
            errorMessage += error.message;
        }
        
        alert(errorMessage);
        
        // Si falla completamente, asegurar que haya al menos una variable
        if (variables.length === 0) {
            addVariable();
            renderVariables();
        }
    }
}

        function importMobData(mobData) {
            const newMobData = {
                typeMob: mobData.typeMob || '',
                mobName: mobData.mobName || 'Mob',
                nameMode: mobData.nameMode || 'junto',
                nameLetters: [],
                nameColor: mobData.nameColor || '#FF0000',
                mobType: mobData.mobType || 'none', // Importante: 'none' para simple
                viewDistance: mobData.viewDistance || 7,
                items: {
                    helmet: { name: '', enchantments: [], leatherColor: 21951 },
                    chestplate: { name: '', enchantments: [], leatherColor: 21951 },
                    leggings: { name: '', enchantments: [], leatherColor: 21951 },
                    boots: { name: '', enchantments: [], leatherColor: 21951 },
                    mainhand: { name: '', enchantments: [] },
                    offhand: { name: '', enchantments: [] }
                },
                effects: [],
                creeperOptions: {
                    powerExplosion: 3,
                    explosionTime: 20,
                    powered: false
                }
            };
            
            if (mobData.nameLetters && Array.isArray(mobData.nameLetters)) {
                newMobData.nameLetters = mobData.nameLetters.map(letter => ({
                    letter: letter.letter || '',
                    color: letter.color || '#FF0000'
                }));
            }
            
            if (mobData.items) {
                Object.keys(mobData.items).forEach(itemKey => {
                    if (newMobData.items[itemKey]) {
                        newMobData.items[itemKey].name = mobData.items[itemKey].name || '';
                        newMobData.items[itemKey].leatherColor = mobData.items[itemKey].leatherColor || 21951;
                        
                        if (mobData.items[itemKey].enchantments && Array.isArray(mobData.items[itemKey].enchantments)) {
                            newMobData.items[itemKey].enchantments = mobData.items[itemKey].enchantments.map(enc => ({
                                name: enc.name || '',
                                level: enc.level || 1
                            }));
                        }
                    }
                });
            }
            
            if (mobData.effects && Array.isArray(mobData.effects)) {
                newMobData.effects = mobData.effects.map(effect => ({
                    name: effect.name || '',
                    duration: effect.duration || 'infinite',
                    amplifier: effect.amplifier || 1
                }));
            }
            
            if (mobData.creeperOptions) {
                newMobData.creeperOptions = {
                    powerExplosion: mobData.creeperOptions.powerExplosion || 3,
                    explosionTime: mobData.creeperOptions.explosionTime || 20,
                    powered: mobData.creeperOptions.powered || false
                };
            }
            
            return newMobData;
        }

        // Event listeners
        document.getElementById('add-variable').addEventListener('click', addVariable);
        
        document.getElementById('prev-page').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                updateNavigation();
                renderVariables();
            }
        });
        
        document.getElementById('next-page').addEventListener('click', function() {
            const totalPages = Math.max(1, Math.ceil(variables.length / itemsPerPage));
            if (currentPage < totalPages) {
                currentPage++;
                updateNavigation();
                renderVariables();
            }
        });
        
document.getElementById('export-config').addEventListener('click', function() {
    const config = {
        variables: variables,
        version: '5.0',
        exportDate: new Date().toISOString()
    };
    
    const jsonString = JSON.stringify(config, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mob_config.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    // Resetear indicador de cambios
    hasUnsavedChanges = false;
    updateSaveIndicator();
});

document.getElementById('download-config').addEventListener('click', function() {
    try {
        const content = generateMCFunctionContent();
        
        if (!content || content.trim() === '') {
            alert('Error: No se pudo generar contenido. Asegúrate de tener al menos una variable configurada.');
            return;
        }
        
        // Para depuración, muestra el contenido en consola
        console.log('Contenido generado:');
        console.log(content);
        console.log('Variables:', variables);
        
        let fileName = 'mob_config.mcfunction';
        if (variables.length > 0 && variables[0].fileName) {
            // Asegurarse de que el nombre del archivo no tenga extensión duplicada
            const baseName = variables[0].fileName.replace(/\.mcfunction$/, '');
            fileName = baseName + '.mcfunction';
        }
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        alert(`Archivo "${fileName}" generado exitosamente!`);
        
    } catch (error) {
        console.error('Error al generar el archivo:', error);
        alert('Error al generar el archivo. Revisa la consola para más detalles.');
    }
});
        document.getElementById('import-config').addEventListener('click', function() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const config = JSON.parse(event.target.result);
                        importConfiguration(config);
                        alert(`Configuración importada correctamente. ${variables.length} variables cargadas.`);
                    } catch (e) {
                        alert('Error al importar: El archivo debe ser un JSON válido exportado desde esta aplicación.');
                    }
                };
                reader.readAsText(file);
            };
            
            fileInput.click();
        });

        // Inicializar
        initialize();
    </script>
