<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Inicio · Estudio personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* SIN SCROLL */
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: white;
        }

        .fondo-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .fondo-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5) saturate(1.2) blur(2px);
            transform: scale(1.3);
            animation: slowZoom 20s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1.3); }
            100% { transform: scale(1.4); }
        }

        .overlay-cinematica {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
            opacity: 0;
            animation: fadeInOverlay 1.5s ease forwards;
        }

        @keyframes fadeInOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .contenido-principal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            padding: 0 10%;
        }

        .caja-texto {
            max-width: 650px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 3rem 3.5rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
            transform: translateX(-5%) translateY(20px);
            opacity: 0;
            animation: floatIn 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateX(-15%) translateY(30px); }
            100% { opacity: 1; transform: translateX(-5%) translateY(0); }
        }

        .caja-texto h1 {
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
            animation-delay: 0.4s;
        }

        .caja-texto h1 span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            display: block;
            font-size: 0.5em;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
            animation-delay: 0.3s;
        }

        .caja-texto p {
            font-size: clamp(1rem, 1.8vw, 1.2rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin: 1.5rem 0 2.5rem;
            line-height: 1.7;
            max-width: 500px;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .grupo-enlaces {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .enlace-destacado {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            font-weight: 400;
            font-size: 1rem;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            text-transform: uppercase;
            min-width: 160px;
            text-align: center;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            animation: fadeInButton 0.8s ease forwards;
            animation-delay: 0.6s;
        }

        .enlace-secundario {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            font-weight: 300;
            font-size: 1rem;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            text-align: center;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            animation: fadeInButton 0.8s ease forwards;
            animation-delay: 0.7s;
        }

        @keyframes fadeInButton {
            0% { transform: translateY(20px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .enlace-destacado:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255,255,255,0.9);
            box-shadow: 0 15px 40px -5px black;
            transform: scale(1.05) translateY(-2px);
            letter-spacing: 2px;
        }

        .enlace-secundario:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.05) translateY(-2px);
            letter-spacing: 1px;
        }

        .elemento-decorativo {
            position: absolute;
            right: 8%;
            bottom: 15%;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            animation: rotateSlow 40s linear infinite;
            opacity: 0;
            transform: scale(0);
            animation: rotateIn 1.2s ease forwards, rotateSlow 40s linear infinite 1.2s;
        }

        @keyframes rotateIn {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(360deg); }
        }

        .elemento-decorativo::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(4px);
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            pointer-events: none;
            opacity: 1;
            transform: translateY(0);
            animation: showDockFirst 0.1s ease forwards;
        }

        @keyframes showDockFirst {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .dock {
            background: rgba(10, 10, 15, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            opacity: 1;
        }

        .dock-item {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.15, 1);
            backdrop-filter: blur(4px);
        }

        .dock-item svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 1.8;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.8);
        }

        .dock-item:hover svg {
            stroke: white;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.7));
            transform: rotate(5deg);
        }

        .dock-item::after {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dock-item:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            top: -40px;
        }

        .marca-agua {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 200;
            opacity: 0.7;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: auto;
            width: 300px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            animation: showLogo 0.1s ease forwards;
        }

        @keyframes showLogo {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }

        .marca-agua:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .marca-agua img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            filter: brightness(0.95) drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        @media (max-width: 700px) {
            .contenido-principal {
                padding: 0 5%;
                align-items: flex-start;
                top: 20%;
            }

            .caja-texto {
                padding: 2rem;
                transform: translateX(0);
                animation: floatInMobile 1s forwards;
                animation-delay: 0.2s;
            }

            @keyframes floatInMobile {
                0% { opacity: 0; transform: translateY(40px); }
                100% { opacity: 1; transform: translateY(0); }
            }

            .caja-texto h1 span {
                font-size: 0.4em;
            }

            .grupo-enlaces {
                flex-direction: column;
                gap: 12px;
            }

            .enlace-destacado, .enlace-secundario {
                width: 100%;
                padding: 0.8rem 1rem;
            }

            /* Ocultar el círculo decorativo solo en móvil */
            .elemento-decorativo {
                display: none;
            }

            .dock-item {
                width: 48px;
                height: 48px;
            }
            
            .dock-item svg {
                width: 24px;
                height: 24px;
            }
            
            .dock-item::after {
                display: none;
            }

            .marca-agua {
                bottom: auto;
                top: 10px;
                left: 10px;
                width: 200px;
                opacity: 0.9;
            }
            
            .marca-agua img {
                max-height: 60px;
            }

            .dock-container {
                bottom: 30px;
            }
        }

        @media (max-width: 480px) {
            .marca-agua {
                top: 8px;
                width: 120px;
            }
            
            .marca-agua img {
                max-height: 60px;
            }
            
            .caja-texto {
                padding: 1.5rem;
            }
            
            .dock-container {
                bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="fondo-media">
        <img src="assets/toolbox/hub/index/fondo.png" alt="Fondo ambiental" onerror="this.src=''">
        <div class="overlay-cinematica"></div>
    </div>

    <div class="contenido-principal">
        <div class="caja-texto">
            <h1>
                <span>Hola, soy</span>
                Carlos
            </h1>
            <p>Exploro la intersección entre la tecnología y la narrativa visual. Cada proyecto es una pieza única construida con intención y detalle.</p>
            <div class="grupo-enlaces">
                <a href="proyectos.html" class="enlace-destacado">Ver proyectos</a>
                <a href="redes.html" class="enlace-secundario">Redes</a>
            </div>
        </div>
    </div>

    <div class="elemento-decorativo"></div>

    <div class="dock-container">
        <div class="dock">
            <a href="index.html" class="dock-item" data-label="Inicio">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3L4 9V21H9V15H15V21H20V9L12 3Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </a>
            <a href="proyectos.html" class="dock-item" data-label="Proyectos">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="14" y="3" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="3" y="14" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                    <rect x="14" y="14" width="7" height="7" rx="1" stroke="white" stroke-width="1.5" fill="none"/>
                </svg>
            </a>
            <a href="redes.html" class="dock-item" data-label="Redes">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5" fill="none"/>
                    <circle cx="19" cy="5" r="2" stroke="white" stroke-width="1.5" fill="none"/>
                    <circle cx="5" cy="19" r="2" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M17 7L14 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M7 17L10 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </a>
            <a href="info.html" class="dock-item" data-label="Info">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M12 8V12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="0.5" fill="white" stroke="white" stroke-width="1.5"/>
                </svg>
            </a>
        </div>
    </div>

    <a href="index.html" class="marca-agua" target="_blank" rel="noopener">
        <img src="assets/logo/logo.png" alt="Logo" onerror="this.style.display='none'">
    </a>

    <script>
        const fondoImg = document.querySelector('.fondo-media img');
        if (fondoImg) {
            fondoImg.onerror = function() {
                this.style.display = 'none';
                document.querySelector('.fondo-media').style.background = 'linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%)';
            };
        }
    </script>
</body>
</html>
