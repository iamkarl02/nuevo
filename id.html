<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Semilla + ID</title>
</head>
<body>
    <!-- Primera pantalla: Solo semilla e ID -->
    <div id="pantallaInicial">
        <h1>Crear Mundo</h1>
        
        <label for="semillaInput">Semilla (obligatoria):</label>
        <input type="text" id="semillaInput" placeholder="Escribe tu semilla">
        
        <br><br>
        
        <label for="idInput">IID (opcional, para unirse):</label>
        <input type="text" id="idInput" placeholder="Pega el IID corto">
        
        <br><br>
        
        <button onclick="crearMundo()">Crear Mundo</button>
        <button onclick="unirsePorIID()">Unirse por IID</button>
    </div>

    <!-- Segunda pantalla: Cuadro de texto modificable -->
    <div id="pantallaJuego" style="display:none;">
        <h2>Mundo Creado</h2>
        
        <p>Semilla: <span id="semillaMostrada"></span></p>
        <p>IID: <span id="iidMostrado"></span></p>
        
        <br>
        
        <label for="textoJuego">Texto del mundo (modifícalo):</label>
        <br>
        <textarea id="textoJuego" rows="10" cols="50"></textarea>
        
        <br><br>
        
        <button onclick="copiarIID()">Copiar IID</button>
        <button onclick="volverInicio()">Volver al inicio</button>
    </div>

    <script>
        // Sistema matemático de compresión/expansión
        class SistemaMatematico {
            constructor() {
                // Base de caracteres para codificación
                this.baseCaracteres = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_';
                this.base = this.baseCaracteres.length;
            }

            // Convertir string a número grande
            stringANumero(str) {
                let numero = BigInt(0);
                for (let i = 0; i < str.length; i++) {
                    numero = numero * BigInt(256) + BigInt(str.charCodeAt(i));
                }
                return numero;
            }

            // Convertir número a string
            numeroAString(numero) {
                let str = '';
                let num = numero;
                while (num > 0) {
                    const resto = Number(num % BigInt(256));
                    str = String.fromCharCode(resto) + str;
                    num = num / BigInt(256);
                }
                return str;
            }

            // Codificar número en base personalizada
            codificarBase(numero) {
                if (numero === BigInt(0)) return this.baseCaracteres[0];
                
                let resultado = '';
                let num = numero;
                
                while (num > 0) {
                    const resto = Number(num % BigInt(this.base));
                    resultado = this.baseCaracteres[resto] + resultado;
                    num = num / BigInt(this.base);
                }
                
                return resultado;
            }

            // Decodificar base personalizada a número
            decodificarBase(str) {
                let numero = BigInt(0);
                
                for (let i = 0; i < str.length; i++) {
                    const valor = this.baseCaracteres.indexOf(str[i]);
                    numero = numero * BigInt(this.base) + BigInt(valor);
                }
                
                return numero;
            }

            // Función hash reversible matemática
            hashMatematico(numero) {
                // Usar operaciones matemáticas reversibles
                const primoGrande = BigInt(9999999967);
                const primoPequeno = BigInt(9999999991);
                
                // Transformación matemática
                let hash = (numero * primoGrande) % primoPequeno;
                
                // Aplicar operaciones XOR reversibles
                hash = hash ^ (hash >> BigInt(12));
                hash = hash ^ (hash << BigInt(25));
                hash = hash ^ (hash >> BigInt(27));
                
                return hash;
            }

            // Función hash inversa (para expandir)
            hashInverso(numero) {
                // Revertir XOR (XOR es su propia inversa)
                let hash = numero;
                hash = hash ^ (hash >> BigInt(27));
                hash = hash ^ (hash << BigInt(25));
                hash = hash ^ (hash >> BigInt(12));
                
                // Revertir multiplicación modular
                const primoGrande = BigInt(9999999967);
                const primoPequeno = BigInt(9999999991);
                
                // Encontrar inverso modular
                const inverso = this.inversoModular(primoGrande, primoPequeno);
                hash = (hash * inverso) % primoPequeno;
                
                return hash;
            }

            // Calcular inverso modular
            inversoModular(a, m) {
                let m0 = m;
                let y = BigInt(0);
                let x = BigInt(1);
                
                if (m === BigInt(1)) return BigInt(0);
                
                while (a > 1) {
                    const q = a / m;
                    let t = m;
                    m = a % m;
                    a = t;
                    t = y;
                    y = x - q * y;
                    x = t;
                }
                
                if (x < 0) x += m0;
                return x;
            }

            // Comprimir datos a IID corto
            comprimirAIID(datos) {
                // Paso 1: Convertir string a número
                const numeroOriginal = this.stringANumero(datos);
                
                // Paso 2: Aplicar hash matemático
                const numeroHash = this.hashMatematico(numeroOriginal);
                
                // Paso 3: Codificar en base personalizada
                const iid = this.codificarBase(numeroHash);
                
                // Paso 4: Si es muy largo, truncar con sistema de reconstrucción
                if (iid.length > 8) {
                    // Guardar información de reconstrucción en los primeros caracteres
                    const longitudOriginal = datos.length;
                    const infoLongitud = this.codificarBase(BigInt(longitudOriginal));
                    const iidFinal = iid.substring(0, 6) + infoLongitud.substring(0, 2);
                    return iidFinal;
                }
                
                return iid;
            }

            // Expandir IID a datos originales
            expandirIID(iid) {
                try {
                    // Paso 1: Decodificar de base personalizada
                    const numeroHash = this.decodificarBase(iid);
                    
                    // Paso 2: Aplicar hash inverso
                    const numeroOriginal = this.hashInverso(numeroHash);
                    
                    // Paso 3: Convertir número a string
                    const datos = this.numeroAString(numeroOriginal);
                    
                    return datos;
                } catch (error) {
                    return null;
                }
            }
        }

        // Variables globales
        let semillaActual = '';
        let textoActual = '';
        let sistemaMatematico = new SistemaMatematico();

        // Generar texto desde semilla
        function generarTextoDesdeSemilla(semilla) {
            const palabrasBase = [
                'manzana', 'perro', 'gato', 'casa', 'árbol', 
                'sol', 'luna', 'estrella', 'mar', 'montaña',
                'río', 'bosque', 'flor', 'fruta', 'verde',
                'azul', 'rojo', 'amarillo', 'blanco', 'negro',
                'fuego', 'agua', 'tierra', 'aire', 'espíritu',
                'dragón', 'espada', 'escudo', 'magia', 'poder'
            ];
            
            const hash = BigInt(this.hashString(semilla));
            const numPalabras = 8 + Number(hash % BigInt(5));
            let texto = '';
            
            for (let i = 0; i < numPalabras; i++) {
                const index = Number((hash + BigInt(i * 13)) % BigInt(palabrasBase.length));
                texto += palabrasBase[index];
                if (i < numPalabras - 1) {
                    texto += ' ';
                }
            }
            
            return texto;
        }

        // Hash simple para semilla
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        // Crear mundo nuevo
        function crearMundo() {
            const semilla = document.getElementById('semillaInput').value.trim();
            
            if (!semilla) {
                alert('La semilla es obligatoria');
                return;
            }
            
            semillaActual = semilla;
            textoActual = generarTextoDesdeSemilla(semilla);
            
            // Mostrar pantalla de juego
            document.getElementById('pantallaInicial').style.display = 'none';
            document.getElementById('pantallaJuego').style.display = 'block';
            
            // Actualizar información
            document.getElementById('semillaMostrada').textContent = semillaActual;
            document.getElementById('textoJuego').value = textoActual;
            
            // Generar IID
            actualizarIID();
        }

        // Unirse por IID
        function unirsePorIID() {
            const iid = document.getElementById('idInput').value.trim();
            
            if (!iid) {
                alert('Por favor ingresa un IID');
                return;
            }
            
            const datosExpandidos = sistemaMatematico.expandirIID(iid);
            
            if (datosExpandidos && datosExpandidos.includes('|')) {
                const partes = datosExpandidos.split('|');
                semillaActual = partes[0];
                textoActual = partes.slice(1).join('|');
                
                // Mostrar pantalla de juego
                document.getElementById('pantallaInicial').style.display = 'none';
                document.getElementById('pantallaJuego').style.display = 'block';
                
                // Actualizar información
                document.getElementById('semillaMostrada').textContent = semillaActual;
                document.getElementById('textoJuego').value = textoActual;
                document.getElementById('iidMostrado').textContent = iid;
            } else {
                alert('IID inválido');
            }
        }

        // Actualizar IID cuando se modifica el texto
        function actualizarIID() {
            const nuevoTexto = document.getElementById('textoJuego').value;
            textoActual = nuevoTexto;
            
            const datosCompletos = semillaActual + '|' + textoActual;
            const iid = sistemaMatematico.comprimirAIID(datosCompletos);
            
            document.getElementById('iidMostrado').textContent = iid;
        }

        // Copiar IID
        function copiarIID() {
            const iid = document.getElementById('iidMostrado').textContent;
            
            navigator.clipboard.writeText(iid).then(() => {
                alert('IID copiado: ' + iid);
            });
        }

        // Volver al inicio
        function volverInicio() {
            document.getElementById('pantallaJuego').style.display = 'none';
            document.getElementById('pantallaInicial').style.display = 'block';
            
            // Limpiar campos
            document.getElementById('semillaInput').value = '';
            document.getElementById('idInput').value = '';
        }

        // Escuchar cambios en el textarea
        document.getElementById('textoJuego').addEventListener('input', actualizarIID);
    </script>
</body>
</html>
