<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Semilla + IID</title>
</head>
<body>
    <!-- Primera pantalla: Solo semilla e IID -->
    <div id="pantallaInicial">
        <h1>Crear Mundo</h1>
        
        <label for="semillaInput">Semilla (obligatoria):</label>
        <input type="text" id="semillaInput" placeholder="Escribe tu semilla">
        
        <br><br>
        
        <label for="iidInput">IID (opcional, para unirse):</label>
        <input type="text" id="iidInput" placeholder="Pega el IID">
        
        <br><br>
        
        <button onclick="crearMundo()">Crear Mundo</button>
        <button onclick="unirsePorIID()">Unirse por IID</button>
    </div>

    <!-- Segunda pantalla: Cuadro de texto modificable -->
    <div id="pantallaJuego" style="display:none;">
        <h2>Mundo Creado</h2>
        
        <p>Semilla: <span id="semillaMostrada"></span></p>
        <p>IID: <span id="iidMostrado"></span></p>
        
        <br>
        
        <label for="textoJuego">Texto del mundo (modifícalo):</label>
        <br>
        <textarea id="textoJuego" rows="10" cols="50"></textarea>
        
        <br><br>
        
        <button onclick="copiarIID()">Copiar IID</button>
        <button onclick="volverInicio()">Volver al inicio</button>
    </div>

    <script>
        // Sistema de compresión matemática completo
        class CompresorMatematico {
            constructor() {
                this.caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_';
                this.base = BigInt(this.caracteres.length);
            }

            // Convertir string completo a BigInt
            stringABigInt(str) {
                let resultado = BigInt(0);
                for (let i = 0; i < str.length; i++) {
                    resultado = resultado * BigInt(256) + BigInt(str.charCodeAt(i));
                }
                return resultado;
            }

            // Convertir BigInt a string
            bigIntAString(num) {
                let resultado = '';
                let numero = num;
                while (numero > BigInt(0)) {
                    const charCode = Number(numero % BigInt(256));
                    resultado = String.fromCharCode(charCode) + resultado;
                    numero = numero / BigInt(256);
                }
                return resultado;
            }

            // Codificar BigInt a base personalizada (esto crea el IID)
            codificarABase(numero) {
                if (numero === BigInt(0)) return this.caracteres[0];
                
                let resultado = '';
                let num = numero;
                
                while (num > BigInt(0)) {
                    const resto = Number(num % this.base);
                    resultado = this.caracteres[resto] + resultado;
                    num = num / this.base;
                }
                
                return resultado;
            }

            // Decodificar de base personalizada a BigInt
            decodificarDeBase(str) {
                let numero = BigInt(0);
                
                for (let i = 0; i < str.length; i++) {
                    const valor = BigInt(this.caracteres.indexOf(str[i]));
                    numero = numero * this.base + valor;
                }
                
                return numero;
            }

            // Comprimir string a IID
            comprimir(texto) {
                // Convertir a BigInt
                const numero = this.stringABigInt(texto);
                
                // Codificar en base personalizada
                const iid = this.codificarABase(numero);
                
                return iid;
            }

            // Descomprimir IID a string
            descomprimir(iid) {
                try {
                    // Decodificar de base personalizada
                    const numero = this.decodificarDeBase(iid);
                    
                    // Convertir a string
                    const texto = this.bigIntAString(numero);
                    
                    return texto;
                } catch (error) {
                    return null;
                }
            }
        }

        // Variables globales
        let semillaActual = '';
        let textoActual = '';
        const compresor = new CompresorMatematico();

        // Generar texto desde semilla
        function generarTextoDesdeSemilla(semilla) {
            const palabrasBase = [
                'manzana', 'perro', 'gato', 'casa', 'árbol', 
                'sol', 'luna', 'estrella', 'mar', 'montaña',
                'río', 'bosque', 'flor', 'fruta', 'verde',
                'azul', 'rojo', 'amarillo', 'blanco', 'negro',
                'fuego', 'agua', 'tierra', 'aire', 'espíritu',
                'dragón', 'espada', 'escudo', 'magia', 'poder'
            ];
            
            // Hash simple para la semilla
            let hash = 0;
            for (let i = 0; i < semilla.length; i++) {
                hash = ((hash << 5) - hash) + semilla.charCodeAt(i);
                hash = hash & hash;
            }
            hash = Math.abs(hash);
            
            const numPalabras = 8 + (hash % 5);
            let texto = '';
            
            for (let i = 0; i < numPalabras; i++) {
                const index = (hash + i * 13) % palabrasBase.length;
                texto += palabrasBase[index];
                if (i < numPalabras - 1) {
                    texto += ' ';
                }
            }
            
            return texto;
        }

        // Crear mundo nuevo
        function crearMundo() {
            const semilla = document.getElementById('semillaInput').value.trim();
            
            if (!semilla) {
                alert('La semilla es obligatoria');
                return;
            }
            
            semillaActual = semilla;
            textoActual = generarTextoDesdeSemilla(semilla);
            
            // Mostrar pantalla de juego
            document.getElementById('pantallaInicial').style.display = 'none';
            document.getElementById('pantallaJuego').style.display = 'block';
            
            // Actualizar información
            document.getElementById('semillaMostrada').textContent = semillaActual;
            document.getElementById('textoJuego').value = textoActual;
            
            // Generar IID
            actualizarIID();
        }

        // Unirse por IID
        function unirsePorIID() {
            const iid = document.getElementById('iidInput').value.trim();
            
            if (!iid) {
                alert('Por favor ingresa un IID');
                return;
            }
            
            // Descomprimir IID
            const datosCompletos = compresor.descomprimir(iid);
            
            if (datosCompletos && datosCompletos.includes('|')) {
                const partes = datosCompletos.split('|');
                semillaActual = partes[0];
                textoActual = partes.slice(1).join('|');
                
                // Mostrar pantalla de juego
                document.getElementById('pantallaInicial').style.display = 'none';
                document.getElementById('pantallaJuego').style.display = 'block';
                
                // Actualizar información
                document.getElementById('semillaMostrada').textContent = semillaActual;
                document.getElementById('textoJuego').value = textoActual;
                document.getElementById('iidMostrado').textContent = iid;
            } else {
                alert('IID inválido o corrupto');
            }
        }

        // Actualizar IID cuando se modifica el texto
        function actualizarIID() {
            const nuevoTexto = document.getElementById('textoJuego').value;
            textoActual = nuevoTexto;
            
            const datosCompletos = semillaActual + '|' + textoActual;
            const iid = compresor.comprimir(datosCompletos);
            
            document.getElementById('iidMostrado').textContent = iid;
        }

        // Copiar IID
        function copiarIID() {
            const iid = document.getElementById('iidMostrado').textContent;
            
            navigator.clipboard.writeText(iid).then(() => {
                alert('IID copiado: ' + iid);
            });
        }

        // Volver al inicio
        function volverInicio() {
            document.getElementById('pantallaJuego').style.display = 'none';
            document.getElementById('pantallaInicial').style.display = 'block';
            
            // Limpiar campos
            document.getElementById('semillaInput').value = '';
            document.getElementById('iidInput').value = '';
        }

        // Escuchar cambios en el textarea
        document.getElementById('textoJuego').addEventListener('input', actualizarIID);
    </script>
</body>
</html>
