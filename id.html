<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Semilla + IID Ultra Corto</title>
</head>
<body>
    <!-- Primera pantalla: Solo semilla e IID -->
    <div id="pantallaInicial">
        <h1>Crear Mundo</h1>
        
        <label for="semillaInput">Semilla (obligatoria):</label>
        <input type="text" id="semillaInput" placeholder="Escribe tu semilla">
        
        <br><br>
        
        <label for="iidInput">IID corto (opcional):</label>
        <input type="text" id="iidInput" placeholder="Pega el IID corto">
        
        <br><br>
        
        <button onclick="crearMundo()">Crear Mundo</button>
        <button onclick="unirsePorIID()">Unirse por IID</button>
    </div>

    <!-- Segunda pantalla: Cuadro de texto modificable -->
    <div id="pantallaJuego" style="display:none;">
        <h2>Mundo Creado</h2>
        
        <p>Semilla: <span id="semillaMostrada"></span></p>
        <p>IID corto: <span id="iidMostrado"></span></p>
        
        <br>
        
        <label for="textoJuego">Texto del mundo (modifícalo):</label>
        <br>
        <textarea id="textoJuego" rows="10" cols="50"></textarea>
        
        <br><br>
        
        <button onclick="copiarIID()">Copiar IID corto</button>
        <button onclick="volverInicio()">Volver al inicio</button>
        
        <br><br>
        
        <details>
            <summary>Ver proceso de compresión</summary>
            <div id="infoCompresion"></div>
        </details>
    </div>

    <script>
        class CompresorUltraCorto {
            constructor() {
                // Usar base más grande para comprimir más
                this.caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_';
                this.base = BigInt(this.caracteres.length);
                
                // Tabla de compresión de patrones comunes
                this.patronesComunes = new Map([
                    ['manzana', 'A'], ['perro', 'B'], ['gato', 'C'], ['casa', 'D'],
                    ['árbol', 'E'], ['sol', 'F'], ['luna', 'G'], ['estrella', 'H'],
                    ['mar', 'I'], ['montaña', 'J'], ['río', 'K'], ['bosque', 'L'],
                    ['flor', 'M'], ['fruta', 'N'], ['verde', 'O'], ['azul', 'P'],
                    ['rojo', 'Q'], ['amarillo', 'R'], ['blanco', 'S'], ['negro', 'T'],
                    ['fuego', 'U'], ['agua', 'V'], ['tierra', 'W'], ['aire', 'X'],
                    ['espíritu', 'Y'], ['dragón', 'Z'], ['espada', 'a'], ['escudo', 'b'],
                    ['magia', 'c'], ['poder', 'd'], [' ', 'e'], ['|', 'f']
                ]);
            }

            // Comprimir texto usando patrones y matemáticas
            comprimirUltra(texto) {
                // Paso 1: Reemplazar palabras comunes con caracteres únicos
                let textoComprimido = texto;
                for (let [patron, reemplazo] of this.patronesComunes) {
                    textoComprimido = textoComprimido.split(patron).join(reemplazo);
                }
                
                // Paso 2: Convertir a BigInt
                let numero = BigInt(0);
                for (let i = 0; i < textoComprimido.length; i++) {
                    numero = numero * BigInt(256) + BigInt(textoComprimido.charCodeAt(i));
                }
                
                // Paso 3: Codificar en base personalizada
                let iid = '';
                let num = numero;
                
                while (num > BigInt(0)) {
                    const resto = Number(num % this.base);
                    iid = this.caracteres[resto] + iid;
                    num = num / this.base;
                }
                
                // Paso 4: Si sigue siendo largo, aplicar compresión adicional
                if (iid.length > 15) {
                    iid = this.compresionAdicional(iid);
                }
                
                return iid;
            }

            // Compresión adicional para casos extremos
            compresionAdicional(iid) {
                // Usar hash para generar un identificador más corto
                let hash = 0;
                for (let i = 0; i < iid.length; i++) {
                    hash = ((hash << 5) - hash) + iid.charCodeAt(i);
                    hash = hash & hash;
                }
                
                // Convertir a base personalizada
                const hashAbsoluto = BigInt(Math.abs(hash));
                let resultado = '';
                let num = hashAbsoluto;
                
                while (num > BigInt(0) && resultado.length < 8) {
                    const resto = Number(num % this.base);
                    resultado = this.caracteres[resto] + resultado;
                    num = num / this.base;
                }
                
                return resultado;
            }

            // Descomprimir IID corto
            descomprimirUltra(iid) {
                try {
                    // Paso 1: Decodificar de base personalizada
                    let numero = BigInt(0);
                    for (let i = 0; i < iid.length; i++) {
                        const valor = BigInt(this.caracteres.indexOf(iid[i]));
                        numero = numero * this.base + valor;
                    }
                    
                    // Paso 2: Convertir a string comprimido
                    let textoComprimido = '';
                    let num = numero;
                    
                    while (num > BigInt(0)) {
                        const charCode = Number(num % BigInt(256));
                        textoComprimido = String.fromCharCode(charCode) + textoComprimido;
                        num = num / BigInt(256);
                    }
                    
                    // Paso 3: Revertir reemplazos de patrones
                    let textoOriginal = textoComprimido;
                    for (let [patron, reemplazo] of this.patronesComunes) {
                        textoOriginal = textoOriginal.split(reemplazo).join(patron);
                    }
                    
                    return textoOriginal;
                } catch (error) {
                    return null;
                }
            }
        }

        // Variables globales
        let semillaActual = '';
        let textoActual = '';
        const compresor = new CompresorUltraCorto();

        // Generar texto desde semilla
        function generarTextoDesdeSemilla(semilla) {
            const palabrasBase = [
                'manzana', 'perro', 'gato', 'casa', 'árbol', 
                'sol', 'luna', 'estrella', 'mar', 'montaña',
                'río', 'bosque', 'flor', 'fruta', 'verde',
                'azul', 'rojo', 'amarillo', 'blanco', 'negro',
                'fuego', 'agua', 'tierra', 'aire', 'espíritu',
                'dragón', 'espada', 'escudo', 'magia', 'poder'
            ];
            
            let hash = 0;
            for (let i = 0; i < semilla.length; i++) {
                hash = ((hash << 5) - hash) + semilla.charCodeAt(i);
                hash = hash & hash;
            }
            hash = Math.abs(hash);
            
            const numPalabras = 8 + (hash % 5);
            let texto = '';
            
            for (let i = 0; i < numPalabras; i++) {
                const index = (hash + i * 13) % palabrasBase.length;
                texto += palabrasBase[index];
                if (i < numPalabras - 1) {
                    texto += ' ';
                }
            }
            
            return texto;
        }

        // Crear mundo nuevo
        function crearMundo() {
            const semilla = document.getElementById('semillaInput').value.trim();
            
            if (!semilla) {
                alert('La semilla es obligatoria');
                return;
            }
            
            semillaActual = semilla;
            textoActual = generarTextoDesdeSemilla(semilla);
            
            document.getElementById('pantallaInicial').style.display = 'none';
            document.getElementById('pantallaJuego').style.display = 'block';
            
            document.getElementById('semillaMostrada').textContent = semillaActual;
            document.getElementById('textoJuego').value = textoActual;
            
            actualizarIID();
        }

        // Unirse por IID
        function unirsePorIID() {
            const iid = document.getElementById('iidInput').value.trim();
            
            if (!iid) {
                alert('Por favor ingresa un IID');
                return;
            }
            
            const datosCompletos = compresor.descomprimirUltra(iid);
            
            if (datosCompletos && datosCompletos.includes('|')) {
                const partes = datosCompletos.split('|');
                semillaActual = partes[0];
                textoActual = partes.slice(1).join('|');
                
                document.getElementById('pantallaInicial').style.display = 'none';
                document.getElementById('pantallaJuego').style.display = 'block';
                
                document.getElementById('semillaMostrada').textContent = semillaActual;
                document.getElementById('textoJuego').value = textoActual;
                document.getElementById('iidMostrado').textContent = iid;
            } else {
                alert('IID inválido');
            }
        }

        // Actualizar IID
        function actualizarIID() {
            const nuevoTexto = document.getElementById('textoJuego').value;
            textoActual = nuevoTexto;
            
            const datosCompletos = semillaActual + '|' + textoActual;
            const iid = compresor.comprimirUltra(datosCompletos);
            
            document.getElementById('iidMostrado').textContent = iid;
            
            // Mostrar info de compresión
            const info = document.getElementById('infoCompresion');
            info.innerHTML = `
                <p><strong>Texto original:</strong> ${datosCompletos}</p>
                <p><strong>Longitud original:</strong> ${datosCompletos.length} caracteres</p>
                <p><strong>IID comprimido:</strong> ${iid}</p>
                <p><strong>Longitud comprimida:</strong> ${iid.length} caracteres</p>
                <p><strong>Ratio de compresión:</strong> ${Math.round((1 - iid.length / datosCompletos.length) * 100)}%</p>
            `;
        }

        // Copiar IID
        function copiarIID() {
            const iid = document.getElementById('iidMostrado').textContent;
            
            navigator.clipboard.writeText(iid).then(() => {
                alert('IID corto copiado: ' + iid);
            });
        }

        // Volver al inicio
        function volverInicio() {
            document.getElementById('pantallaJuego').style.display = 'none';
            document.getElementById('pantallaInicial').style.display = 'block';
            
            document.getElementById('semillaInput').value = '';
            document.getElementById('iidInput').value = '';
        }

        // Escuchar cambios
        document.getElementById('textoJuego').addEventListener('input', actualizarIID);
    </script>
</body>
</html>
