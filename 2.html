<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spotify Ultra Pro - Speed Edition | Mobile Ready</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== BASE ========== */
        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-light: #282828;
            --spotify-green: #1db954;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --player-height: 80px;
            --sidebar-width: 280px;
            --queue-width: 280px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            touch-action: pan-x pan-y;
        }

        /* ========== LAYOUT PRINCIPAL ========== */
        .app-container {
            display: grid;
            grid-template-areas: "sidebar main queue" "player player player";
            grid-template-columns: var(--sidebar-width) 1fr var(--queue-width);
            grid-template-rows: 1fr var(--player-height);
            height: 100%;
            width: 100%;
            transition: grid-template-columns 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* ========== SIDEBAR (BIBLIOTECA/PLAYLISTS) ========== */
        .sidebar {
            grid-area: sidebar;
            background: var(--bg-black);
            border-right: 1px solid #1a1a1a;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: visibility 0.3s, opacity 0.3s;
            z-index: 20;
        }

        body.sidebar-hidden .sidebar {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* ========== PANEL COLA ========== */
        .queue-panel {
            grid-area: queue;
            background: var(--bg-black);
            border-left: 1px solid #1a1a1a;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            transition: visibility 0.3s, opacity 0.3s;
            z-index: 20;
        }

        body:not(.queue-open) .queue-panel {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        body.queue-open {
            grid-template-columns: var(--sidebar-width) 1fr var(--queue-width);
        }

        body.sidebar-hidden:not(.queue-open) {
            grid-template-columns: 0px 1fr 0px;
        }

        /* ========== MAIN (ÁREA VISUAL) ========== */
        .main-view {
            grid-area: main;
            margin: 8px;
            border-radius: 16px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        #video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 12px;
            pointer-events: none;
        }

        #bg-blur-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(40px) brightness(0.5);
            transform: scale(1.1);
            display: none;
            z-index: 1;
        }

        .vinyl-disk {
            width: min(280px, 60vw);
            height: min(280px, 60vw);
            border-radius: 50%;
            border: 6px solid #111;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            overflow: hidden;
            display: none;
            animation: spin 15s linear infinite;
            z-index: 3;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #intro-text {
            text-align: center;
            color: #555;
            z-index: 5;
            padding: 20px;
        }

        /* ========== PLAYER BAR ========== */
        .player-bar {
            grid-area: player;
            background: #000;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 8px;
            position: relative;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1.2;
        }

        #bar-img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            display: none;
            flex-shrink: 0;
        }

        .controls-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 2;
        }

        .main-btns {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .play-toggle {
            font-size: 2.2rem !important;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        #progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
            flex: 1.2;
        }

        .vol-bar {
            width: 70px;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
        }

        .icon-btn {
            cursor: pointer;
            color: var(--text-gray);
            transition: 0.2s;
            font-size: 1.2rem;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .active-btn {
            color: var(--spotify-green) !important;
        }

        /* ========== SCROLL y LISTAS ========== */
        .library-scroll {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .library-item, .queue-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s ease;
            margin-bottom: 4px;
            touch-action: manipulation;
        }

        .library-item:active, .queue-item:active {
            background-color: #2a2a2a;
        }

        .active-track {
            background-color: rgba(29, 185, 84, 0.15) !important;
        }

        .library-item img, .queue-item img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: cover;
            background: #282828;
        }

        .item-info {
            overflow: hidden;
            flex: 1;
        }

        .item-info div {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-info span {
            font-size: 11px;
            color: var(--text-gray);
        }

        /* ========== TABS Y BUSCADOR ========== */
        .side-card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 12px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 30px;
            background: #242424;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab.active {
            background: var(--spotify-green);
            color: black;
        }

        .search-box {
            background: #242424;
            border-radius: 30px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        /* ========== PLAYLIST GRID ========== */
        .playlist-img-grid {
            width: 48px;
            height: 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            border-radius: 6px;
            overflow: hidden;
            margin-right: 12px;
            background: #282828;
        }

        /* ========== CONTEXT MENU MÓVIL (SIMPLIFICADO) ========== */
        #context-menu {
            position: fixed;
            background: #282828;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6);
            display: none;
            z-index: 2000;
            min-width: 200px;
            backdrop-filter: blur(20px);
        }

        .context-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #e0e0e0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .context-item:active {
            background: #3e3e3e;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #282828;
            padding: 24px;
            border-radius: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            background: #3e3e3e;
            border: none;
            border-radius: 40px;
            color: white;
            margin: 16px 0;
            font-size: 16px;
        }

        .btn-spotify {
            background: var(--spotify-green);
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ========== ONBOARDING ========== */
        #onboarding-arrow {
            position: absolute;
            bottom: 90px;
            right: 15px;
            color: var(--spotify-green);
            animation: bounce 0.8s infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* ========== RESPONSIVE + TOUCH ========== */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 0px 1fr 0px;
            }

            body.sidebar-hidden .sidebar {
                visibility: visible;
                opacity: 1;
                pointer-events: auto;
            }

            body.queue-open .queue-panel {
                visibility: visible;
                opacity: 1;
                pointer-events: auto;
            }

            /* Sidebar flotante en móvil */
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                width: 85%;
                max-width: 300px;
                height: 100%;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                z-index: 200;
                background: #000;
                border-right: 1px solid #222;
            }

            body.sidebar-hidden .sidebar {
                transform: translateX(0);
                visibility: visible;
                opacity: 1;
            }

            .queue-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 85%;
                max-width: 300px;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.25s ease;
                z-index: 200;
                background: #000;
                border-left: 1px solid #222;
            }

            body.queue-open .queue-panel {
                transform: translateX(0);
                visibility: visible;
                opacity: 1;
            }

            /* Ajustes para overlay del main cuando menus abiertos */
            .main-view {
                margin: 6px;
            }

            .player-bar {
                padding: 0 8px;
                gap: 6px;
            }

            .now-playing {
                flex: 1;
                min-width: 0;
            }

            #bar-img {
                width: 40px;
                height: 40px;
            }

            .controls-center {
                flex: 2;
            }

            .main-btns {
                gap: 12px;
            }

            .play-toggle {
                font-size: 1.8rem !important;
            }

            .volume-controls {
                gap: 6px;
                flex: 1;
            }

            .vol-bar {
                width: 50px;
            }

            .item-info div {
                font-size: 12px;
            }

            .vinyl-disk {
                width: min(220px, 55vw);
                height: min(220px, 55vw);
            }
        }

        @media (max-width: 480px) {
            .main-btns {
                gap: 10px;
            }
            .volume-controls .fa-volume-high {
                display: none;
            }
            .vol-bar {
                width: 40px;
            }
            .icon-btn {
                font-size: 1rem;
            }
            #bar-img {
                width: 36px;
                height: 36px;
            }
        }

        .active-playlist-name {
            color: var(--spotify-green);
            font-size: 10px;
            display: block;
        }

        #pl-playing-indicator {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            color: var(--spotify-green);
            font-weight: bold;
            backdrop-filter: blur(8px);
            display: none;
            z-index: 15;
            white-space: nowrap;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="side-card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('lib')">Biblioteca</div>
                <div class="tab" onclick="switchTab('play')">Playlists</div>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="libSearch" placeholder="Buscar..." oninput="filterLib()">
            </div>
        </div>
        <div class="side-card library-scroll" id="library-list"></div>
    </aside>

    <main class="main-view">
        <div id="pl-playing-indicator"></div>
        <img id="bg-blur-image" src="">
        <video id="video-player" loop playsinline></video>
        <div class="vinyl-disk" id="disk-element">
            <img src="" id="disk-img" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <div id="intro-text">
            <i class="fa-solid fa-folder-open" style="font-size: 4rem; margin-bottom: 12px; color: #1db954;"></i>
            <p>Toca el botón + para cargar carpeta</p>
        </div>
    </main>

    <aside class="queue-panel">
        <div style="padding: 10px; font-weight: 700; border-bottom: 1px solid #1a1a1a;">Siguiente en la fila</div>
        <div class="library-scroll" id="queue-list"></div>
    </aside>

    <footer class="player-bar">
        <div id="onboarding-arrow">
            <span>CARGAR</span>
            <i class="fa-solid fa-plus-circle"></i>
        </div>
        <div class="now-playing">
            <img id="bar-img" src="">
            <div class="item-info">
                <div id="bar-title">-</div>
                <span id="bar-artist">Sin música</span>
                <span id="active-pl-label" class="active-playlist-name"></span>
            </div>
        </div>

        <div class="controls-center">
            <div class="main-btns">
                <i class="fa-solid fa-shuffle icon-btn" id="shuffleBtn" onclick="toggleOption('shuffle')"></i>
                <i class="fa-solid fa-backward-step icon-btn" onclick="prevTrack()"></i>
                <i class="fa-solid fa-circle-play play-toggle icon-btn" id="playBtn" onclick="togglePlay()"></i>
                <i class="fa-solid fa-forward-step icon-btn" onclick="nextTrack()"></i>
                <i class="fa-solid fa-repeat icon-btn" id="repeatBtn" onclick="toggleOption('repeat')"></i>
            </div>
            <div style="width: 100%; display: flex; align-items: center; gap: 8px; font-size: 10px;">
                <span id="time-now">0:00</span>
                <div class="progress-bar" id="p-bar" onmousedown="startDrag(event)" ontouchstart="startDragTouch(event)">
                    <div id="progress-fill"></div>
                </div>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high" style="color: #b3b3b3;"></i>
            <div class="vol-bar" onmousedown="startVolDrag(event)" ontouchstart="startVolDragTouch(event)">
                <div id="vol-fill" style="width:70%; height:100%; background:#fff; border-radius:2px;"></div>
            </div>
            <i class="fa-solid fa-book-bookmark icon-btn" onclick="toggleLibrary()"></i>
            <i class="fa-solid fa-list-ul icon-btn" onclick="toggleQueue()"></i>
            <i class="fa-solid fa-expand icon-btn" id="fs-icon" onclick="toggleFullscreen()"></i>
            <i class="fa-solid fa-plus icon-btn" style="color: #fff; font-size: 1.4rem;" onclick="selectFolder()"></i>
        </div>
    </footer>
</div>

<div id="context-menu"></div>
<div id="custom-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title">Título</h3>
        <input type="text" id="modal-input" placeholder="..." autocomplete="off">
        <div class="modal-btns" style="display:flex; justify-content:flex-end; gap:12px; margin-top:12px;">
            <button class="btn-flat" style="background:transparent; color:white; border:none;" onclick="closeModal()">CANCELAR</button>
            <button class="btn-spotify" id="modal-confirm-btn">ACEPTAR</button>
        </div>
    </div>
</div>

<audio id="audio-player"></audio>

<script>
    // ---------- TODAS LAS FUNCIONES ORIGINALES + ADAPTACIONES TÁCTILES ----------
    let allTracks = [], filteredTracks = [], playbackHistory = [];
    let coverCache = new Map();
    let currentIndex = -1, isShuffle = false, isRepeat = false, isDragging = false;
    let currentMediaURL = null;
    let playQueue = [];
    let configFolder = null;
    let playlists = [];
    let currentTab = 'lib';
    let contextTrackIndex = -1;
    let contextPlaylistIndex = -1;
    let contextQueueIndex = -1;
    let activePlaylistIdx = -1;

    const audio = document.getElementById('audio-player');
    const video = document.getElementById('video-player');
    const bgBlur = document.getElementById('bg-blur-image');
    let active = audio;

    // --- MODAL ---
    function openModal(title, callback, defaultValue = "") {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        const input = document.getElementById('modal-input');
        input.value = defaultValue;
        modal.style.display = 'flex';
        input.focus();
        document.getElementById('modal-confirm-btn').onclick = () => {
            callback(input.value);
            closeModal();
        };
    }
    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

    // --- SAVE & LOAD CONFIG ---
    async function saveConfig() {
        if (!configFolder) return;
        const configData = {
            lastTrack: currentIndex !== -1 ? allTracks[currentIndex].name : null,
            currentTime: active.currentTime,
            queue: playQueue,
            playlists: playlists,
            isShuffle, isRepeat,
            activePlaylistIdx
        };
        try {
            const fileHandle = await configFolder.getFileHandle('config.json', { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(configData));
            await writable.close();
        } catch(e) {}
    }

    async function loadConfig() {
        try {
            const fileHandle = await configFolder.getFileHandle('config.json');
            const file = await fileHandle.getFile();
            const data = JSON.parse(await file.text());
            playlists = data.playlists || [];
            playQueue = data.queue || [];
            isShuffle = data.isShuffle || false;
            isRepeat = data.isRepeat || false;
            activePlaylistIdx = data.activePlaylistIdx !== undefined ? data.activePlaylistIdx : -1;
            if (data.lastTrack) {
                const idx = allTracks.findIndex(t => t.name === data.lastTrack);
                if (idx !== -1) {
                    await playIndex(idx);
                    active.currentTime = data.currentTime || 0;
                    active.pause();
                    document.getElementById('playBtn').className = "fa-solid fa-circle-play play-toggle icon-btn";
                    document.getElementById('disk-element').style.animationPlayState = 'paused';
                }
            }
            updateStatusLabel();
            renderQueue();
        } catch(e) {}
    }

    function updateStatusLabel() {
        const label = document.getElementById('active-pl-label');
        const indicator = document.getElementById('pl-playing-indicator');
        if (activePlaylistIdx !== -1 && playlists[activePlaylistIdx]) {
            const name = playlists[activePlaylistIdx].name.toUpperCase();
            label.innerText = `PLAYLIST: ${name}`;
            indicator.innerText = `Reproduciendo: ${name}`;
            indicator.style.display = 'block';
        } else {
            label.innerText = "";
            indicator.style.display = 'none';
        }
    }

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        if(window.event && window.event.target) window.event.target.classList.add('active');
        else document.querySelector(`.tab:first-child`).classList.add('active');
        renderLibrary();
    }

    // --- IMAGENES Y COVERS ---
    function getCoverURL(name) { return coverCache.get(name.toLowerCase().trim()) || 'https://via.placeholder.com/150?text=♫'; }
    
    async function selectFolder() {
        try {
            const dir = await window.showDirectoryPicker();
            document.getElementById('onboarding-arrow').style.display = 'none';
            allTracks = [];
            coverCache.clear();
            let coverFiles = new Map();
            try { configFolder = await dir.getDirectoryHandle('config', { create: true }); } catch(e) {}
            for await (const entry of dir.values()) {
                if (entry.kind === 'file') {
                    const ext = entry.name.toLowerCase();
                    if (ext.endsWith('.mp3') || ext.endsWith('.mp4')) allTracks.push(entry);
                }
                if (entry.kind === 'directory' && entry.name.toLowerCase() === 'portadas') {
                    for await (const img of entry.values()) {
                        coverFiles.set(img.name.replace(/\.[^/.]+$/, "").toLowerCase().trim(), img);
                    }
                }
            }
            for (let [name, fileHandle] of coverFiles) {
                const file = await fileHandle.getFile();
                coverCache.set(name, URL.createObjectURL(file));
            }
            filteredTracks = [...allTracks];
            if (configFolder) await loadConfig();
            renderLibrary();
        } catch (err) { alert("Selecciona una carpeta con música"); }
    }

    function renderLibrary() {
        const container = document.getElementById('library-list');
        container.innerHTML = '';
        if (currentTab === 'lib') {
            filteredTracks.forEach((file) => {
                const cleanName = file.name.replace(/\.[^/.]+$/, "");
                const [t, a] = cleanName.split(' - ');
                const trackIdx = allTracks.indexOf(file);
                const div = document.createElement('div');
                div.className = `library-item ${trackIdx === currentIndex ? 'active-track' : ''}`;
                div.dataset.index = trackIdx;
                div.innerHTML = `
                    <img src="${getCoverURL(cleanName)}">
                    <div class="item-info"><div>${t || cleanName}</div><span>${a || 'Desconocido'}</span></div>
                    <i class="fa-solid fa-plus icon-btn" style="font-size:1rem" onclick="addToQueue(event, ${trackIdx})"></i>
                `;
                div.onclick = (e) => { if(e.target.tagName !== 'I') { activePlaylistIdx = -1; updateStatusLabel(); playIndex(trackIdx); } };
                container.appendChild(div);
            });
        } else {
            container.innerHTML = `<div class="tab" style="margin-bottom:12px;" onclick="createPlaylist()">+ CREAR NUEVA PLAYLIST</div>`;
            playlists.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `library-item ${activePlaylistIdx === i ? 'active-track' : ''}`;
                div.dataset.index = i;
                let imgHtml = '';
                if (p.image) imgHtml = `<img src="${p.image}">`;
                else {
                    let items = p.songs.slice(0,4);
                    let imgs = items.map(sName => `<img src="${getCoverURL(sName.replace(/\.[^/.]+$/, ""))}">`);
                    while(imgs.length < 4) imgs.push('<div style="background:#282828"></div>');
                    imgHtml = `<div class="playlist-img-grid">${imgs.join('')}</div>`;
                }
                div.innerHTML = `${imgHtml}<div class="item-info"><div>${p.name}</div><span>${p.songs.length} canciones</span></div>`;
                div.onclick = () => { activePlaylistIdx = i; playPlaylist(i); };
                container.appendChild(div);
            });
        }
    }

    async function playPlaylist(idx) {
        const p = playlists[idx];
        if (!p.songs.length) return;
        playQueue = [];
        let songsToLoad = [...p.songs];
        if (isShuffle) songsToLoad = songsToLoad.sort(() => Math.random() - 0.5);
        songsToLoad.forEach(sName => {
            const trackIdx = allTracks.findIndex(t => t.name === sName);
            if (trackIdx !== -1) playQueue.push(trackIdx);
        });
        if (playQueue.length) playIndex(playQueue.shift());
        renderQueue();
        updateStatusLabel();
    }

    async function playIndex(index) {
        if (index < 0 || index >= allTracks.length) return;
        if (currentIndex !== -1 && currentIndex !== index) playbackHistory.push(currentIndex);
        currentIndex = index;
        const file = await allTracks[index].getFile();
        const cleanName = file.name.replace(/\.[^/.]+$/, "");
        const [titulo, autor] = cleanName.split(' - ');
        document.getElementById('bar-title').innerText = titulo || cleanName;
        document.getElementById('bar-artist').innerText = autor || 'Desconocido';
        const imgURL = getCoverURL(cleanName);
        document.getElementById('bar-img').src = document.getElementById('disk-img').src = bgBlur.src = imgURL;
        document.getElementById('bar-img').style.display = 'block';
        document.getElementById('intro-text').style.display = 'none';
        audio.pause(); video.pause();
        if (currentMediaURL) URL.revokeObjectURL(currentMediaURL);
        currentMediaURL = URL.createObjectURL(file);
        if (file.name.toLowerCase().endsWith('.mp4')) {
            video.src = currentMediaURL; video.style.display = 'block'; bgBlur.style.display = 'none';
            video.play(); active = video; document.getElementById('disk-element').style.display = 'none';
        } else {
            audio.src = currentMediaURL; audio.play(); active = audio;
            document.getElementById('disk-element').style.display = 'block'; bgBlur.style.display = 'block'; video.style.display = 'none';
        }
        document.getElementById('playBtn').className = "fa-solid fa-circle-pause play-toggle icon-btn";
        document.getElementById('disk-element').style.animationPlayState = 'running';
        renderLibrary();
        active.onended = nextTrack;
        active.ontimeupdate = () => updateProgressUI();
        saveConfig();
    }

    function nextTrack() {
        if (isRepeat) { playIndex(currentIndex); return; }
        let next;
        if (playQueue.length > 0) next = playQueue.shift();
        else next = isShuffle ? Math.floor(Math.random() * allTracks.length) : (currentIndex + 1) % allTracks.length;
        playIndex(next); renderQueue();
    }

    function prevTrack() {
        if (active.currentTime > 3) { active.currentTime = 0; return; }
        playIndex(playbackHistory.length > 0 ? playbackHistory.pop() : (currentIndex - 1 + allTracks.length) % allTracks.length);
    }

    function togglePlay() {
        if (active.paused) { active.play(); document.getElementById('playBtn').className = "fa-solid fa-circle-pause play-toggle icon-btn"; document.getElementById('disk-element').style.animationPlayState = 'running'; }
        else { active.pause(); document.getElementById('playBtn').className = "fa-solid fa-circle-play play-toggle icon-btn"; document.getElementById('disk-element').style.animationPlayState = 'paused'; }
    }

    function toggleOption(opt) {
        if(opt === 'shuffle') { isShuffle = !isShuffle; document.getElementById('shuffleBtn').classList.toggle('active-btn', isShuffle); }
        if(opt === 'repeat') { isRepeat = !isRepeat; document.getElementById('repeatBtn').classList.toggle('active-btn', isRepeat); }
        saveConfig();
    }

    function addToQueue(e, idx) { e.stopPropagation(); playQueue.push(idx); renderQueue(); saveConfig(); }
    function renderQueue() {
        const container = document.getElementById('queue-list');
        container.innerHTML = '';
        playQueue.forEach((trackIdx, qIndex) => {
            const file = allTracks[trackIdx];
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            const [t, a] = cleanName.split(' - ');
            const div = document.createElement('div');
            div.className = 'queue-item';
            div.dataset.qindex = qIndex;
            div.innerHTML = `<img src="${getCoverURL(cleanName)}"><div class="item-info"><div>${t || cleanName}</div><span>${a || 'Desconocido'}</span></div>`;
            div.onclick = () => { playQueue.splice(qIndex,1); if(playQueue.length) playIndex(playQueue.shift()); renderQueue(); saveConfig(); };
            container.appendChild(div);
        });
    }

    function fmt(s) { const min = Math.floor(s/60), sec = Math.floor(s%60); return `${min}:${sec<10?'0':''}${sec}`; }
    function updateProgressUI() { if(isDragging) return; let pct = (active.currentTime/active.duration)*100||0; document.getElementById('progress-fill').style.width = pct+'%'; document.getElementById('time-now').innerText = fmt(active.currentTime); document.getElementById('time-total').innerText = fmt(active.duration||0); }
    function startDrag(e) { isDragging=true; const move=(e)=>{ const rect=document.getElementById('p-bar').getBoundingClientRect(); let pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)); document.getElementById('progress-fill').style.width=(pct*100)+'%'; active.currentTime=pct*(active.duration||0); }; const stop=()=>{ isDragging=false; window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',stop); }; window.addEventListener('mousemove',move); window.addEventListener('mouseup',stop); }
    function startDragTouch(e) { e.preventDefault(); isDragging=true; const move=(te)=>{ const touch=te.touches[0]; const rect=document.getElementById('p-bar').getBoundingClientRect(); let pct=Math.max(0,Math.min(1,(touch.clientX-rect.left)/rect.width)); document.getElementById('progress-fill').style.width=(pct*100)+'%'; active.currentTime=pct*(active.duration||0); }; const stop=()=>{ isDragging=false; window.removeEventListener('touchmove',move); window.removeEventListener('touchend',stop); }; window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',stop); }
    function startVolDrag(e) { const move=(e)=>{ const rect=document.querySelector('.vol-bar').getBoundingClientRect(); let pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)); document.getElementById('vol-fill').style.width=(pct*100)+'%'; audio.volume=video.volume=pct; }; const stop=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',stop); }; window.addEventListener('mousemove',move); window.addEventListener('mouseup',stop); }
    function startVolDragTouch(e) { e.preventDefault(); const move=(te)=>{ const touch=te.touches[0]; const rect=document.querySelector('.vol-bar').getBoundingClientRect(); let pct=Math.max(0,Math.min(1,(touch.clientX-rect.left)/rect.width)); document.getElementById('vol-fill').style.width=(pct*100)+'%'; audio.volume=video.volume=pct; }; const stop=()=>{ window.removeEventListener('touchmove',move); window.removeEventListener('touchend',stop); }; window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',stop); }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function toggleQueue() { document.body.classList.toggle('queue-open'); }
    function toggleLibrary() { document.body.classList.toggle('sidebar-hidden'); }
    function filterLib() { const q = document.getElementById('libSearch').value.toLowerCase(); filteredTracks = allTracks.filter(f=>f.name.toLowerCase().includes(q)); renderLibrary(); }
    function createPlaylist() { openModal("Nueva Playlist", async (name)=>{ if(name){ playlists.push({name, songs:[], image:null}); await saveConfig(); renderLibrary(); } }); }
    function addTrackToPlaylist(pIdx) { if(contextTrackIndex!==-1){ const track=allTracks[contextTrackIndex]; if(!playlists[pIdx].songs.includes(track.name)){ playlists[pIdx].songs.push(track.name); saveConfig(); renderLibrary(); } } }
    function createPlaylistWithTrack() { openModal("Nombre Playlist", async (name)=>{ if(name){ playlists.push({name, songs:[allTracks[contextTrackIndex].name], image:null}); await saveConfig(); renderLibrary(); } }); }
    window.oncontextmenu = (e)=>{ e.preventDefault(); return false; };
    function init() { renderLibrary(); audio.volume=0.7; video.volume=0.7; document.getElementById('vol-fill').style.width='70%'; }
    init();
</script>
</body>
</html>
