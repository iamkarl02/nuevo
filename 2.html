<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MÚSICA PRO - Mobile Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
        }

        /* HEADER */
        .header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .logo-section {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .logo-icon {
            font-size: 1.4rem;
            color: #1db954;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #1db954);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            font-size: 0.6rem;
            background: rgba(29,185,84,0.2);
            padding: 2px 6px;
            border-radius: 20px;
            color: #1db954;
            margin-left: 6px;
        }

        .header-icons {
            display: flex;
            gap: 18px;
        }

        .header-icons i {
            font-size: 1.2rem;
            color: #b3b3b3;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-icons i:active {
            color: #1db954;
            transform: scale(0.95);
        }

        /* TABS */
        .tabs-container {
            padding: 12px 20px 8px 20px;
            background: #000000;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 50px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #b3b3b3;
        }

        .tab.active {
            background: #1db954;
            color: #000000;
            box-shadow: 0 2px 8px rgba(29,185,84,0.3);
        }

        /* SEARCH */
        .search-bar {
            margin-top: 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 0.5px solid rgba(255,255,255,0.05);
        }

        .search-bar i {
            color: #b3b3b3;
            font-size: 0.85rem;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            font-size: 13px;
            outline: none;
        }

        /* CONTENT */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .greeting {
            margin-bottom: 14px;
        }

        .greeting h2 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .greeting p {
            color: #b3b3b3;
            font-size: 0.75rem;
        }

        /* LISTS */
        .track-list, .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-item, .playlist-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .track-item:active, .playlist-item:active {
            background: rgba(255,255,255,0.07);
            transform: scale(0.99);
        }

        .track-item.active {
            background: rgba(29,185,84,0.12);
            border-left: 3px solid #1db954;
        }

        .track-cover, .playlist-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 12px;
            background: #282828;
            flex-shrink: 0;
        }

        .playlist-cover-grid {
            width: 48px;
            height: 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            border-radius: 10px;
            overflow: hidden;
            margin-right: 12px;
            background: #282828;
            flex-shrink: 0;
        }

        .playlist-cover-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 10px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .track-btn {
            color: #b3b3b3;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 5px;
            transition: all 0.1s;
        }

        .track-btn:active {
            transform: scale(0.9);
            color: #1db954;
        }

        .track-btn-playlist {
            color: #1db954;
        }

        /* PLAYER BAR */
        .player-bar {
            background: rgba(8,8,8,0.95);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255,255,255,0.08);
            padding: 10px 20px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .player-track {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        #playerCover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .player-track-info {
            flex: 1;
            min-width: 0;
        }

        #playerTitle {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #playerArtist {
            font-size: 10px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BOTÓN + DENTRO DEL PLAYER (A LA DERECHA) */
        .player-add-btn {
            background: #1db954;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(29,185,84,0.3);
            flex-shrink: 0;
        }

        .player-add-btn:active {
            transform: scale(0.92);
            background: #1aa34a;
        }

        .player-add-btn i {
            font-size: 1rem;
            color: #000000;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 4px 0;
        }

        .player-controls i {
            font-size: 1.3rem;
            color: #b3b3b3;
            cursor: pointer;
            transition: all 0.1s;
        }

        .player-controls i:active {
            transform: scale(0.92);
            color: #1db954;
        }

        .player-controls .play-btn {
            font-size: 2.2rem;
            color: white;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1db954;
            border-radius: 2px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: #1db954;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:active .progress-fill::after {
            opacity: 1;
        }

        .time {
            font-size: 10px;
            color: #b3b3b3;
            min-width: 35px;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .vol-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            cursor: pointer;
        }

        .vol-fill {
            width: 70%;
            height: 100%;
            background: #b3b3b3;
            border-radius: 2px;
        }

        /* DRAWERS */
        .drawer {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 85%;
            max-width: 320px;
            background: rgba(10,10,10,0.98);
            backdrop-filter: blur(20px);
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            border-right: 0.5px solid rgba(255,255,255,0.08);
        }

        .drawer-right {
            right: 0;
            left: auto;
            transform: translateX(100%);
            border-right: none;
            border-left: 0.5px solid rgba(255,255,255,0.08);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 22px 20px;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .drawer-header i {
            font-size: 1.2rem;
            cursor: pointer;
            color: #b3b3b3;
        }

        .drawer-header i:active {
            color: #1db954;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background 0.1s;
        }

        .drawer-item:active {
            background: rgba(255,255,255,0.08);
        }

        .empty-state {
            text-align: center;
            padding: 35px 20px;
            color: #555;
        }

        .empty-state i {
            font-size: 2.2rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .playlist-badge {
            font-size: 9px;
            color: #1db954;
            margin-top: 2px;
            display: block;
        }

        .active-btn {
            color: #1db954 !important;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 22px;
            border-radius: 24px;
            width: 85%;
            max-width: 320px;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: none;
            border-radius: 30px;
            color: white;
            margin: 14px 0;
            font-size: 13px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-green {
            background: #1db954;
            color: black;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden-input {
            display: none;
        }

        .folder-info {
            background: rgba(29,185,84,0.1);
            padding: 6px 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 10px;
            color: #1db954;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* SELECTOR DE PLAYLIST */
        .playlist-selector {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-radius: 24px 24px 0 0;
            padding: 18px;
            z-index: 250;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 60%;
            overflow-y: auto;
        }

        .playlist-selector.open {
            transform: translateY(0);
        }

        .playlist-selector h4 {
            margin-bottom: 12px;
            color: #1db954;
            font-size: 1rem;
        }

        .playlist-option {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-option:active {
            background: #3a3a3a;
        }

        .create-playlist-option {
            background: rgba(29,185,84,0.15);
            border: 1px dashed #1db954;
            color: #1db954;
            justify-content: center;
        }

        /* FULLSCREEN */
        .fullscreen-media {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .fullscreen-media.active {
            display: flex;
        }

        .fullscreen-vinyl {
            width: min(260px, 65vw);
            height: min(260px, 65vw);
            border-radius: 50%;
            border: 4px solid #282828;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .fullscreen-vinyl img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .close-fullscreen {
            position: absolute;
            top: 25px;
            right: 20px;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            width: 42px;
            height: 42px;
            border-radius: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-fullscreen:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <div class="header">
            <div class="logo-section">
                <i class="fa-solid fa-music logo-icon"></i>
                <span class="logo-text">MÚSICA PRO</span>
                <span class="logo-badge">MP3</span>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-list-ul" id="queueBtn"></i>
                <i class="fa-solid fa-bars" id="menuBtn"></i>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs">
                <div class="tab active" data-tab="lib">Música</div>
                <div class="tab" data-tab="play">Playlists</div>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar canciones...">
            </div>
        </div>

        <div class="content" id="content">
            <div class="greeting">
                <h2>Buenas</h2>
                <p>🎧 Tu música, donde quieras</p>
            </div>
            <div id="plIndicator" style="background:rgba(29,185,84,0.1); padding:6px; border-radius:8px; margin-bottom:8px; text-align:center; font-size:10px; display:none;"></div>
            <div id="folderInfo" class="folder-info" style="display:none;">
                <span><i class="fa-solid fa-folder-open"></i> <span id="folderName"></span></span>
                <span><i class="fa-solid fa-music"></i> <span id="trackCount">0</span> canciones</span>
            </div>
            <div id="trackListContainer" class="track-list"></div>
            <div id="playlistListContainer" class="playlist-list" style="display:none;"></div>
            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-headphones"></i>
                <p>Selecciona una carpeta con música MP3</p>
                <p style="font-size:11px; margin-top:6px; color:#1db954;">Toca el botón + en el reproductor para comenzar</p>
            </div>
        </div>

        <div class="player-bar">
            <div class="player-track">
                <img id="playerCover" src="" style="display:none;">
                <div class="player-track-info">
                    <div id="playerTitle">-</div>
                    <span id="playerArtist">Sin música</span>
                    <span id="activePlaylistLabel" class="playlist-badge"></span>
                </div>
                <div class="player-add-btn" id="fabBtn">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-shuffle" id="shuffleIcon"></i>
                <i class="fa-solid fa-backward-step" id="prevBtn"></i>
                <i class="fa-solid fa-circle-play play-btn" id="playPauseBtn"></i>
                <i class="fa-solid fa-forward-step" id="nextBtn"></i>
                <i class="fa-solid fa-repeat" id="repeatIcon"></i>
            </div>
            <div class="progress-container">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time" id="totalTime">0:00</span>
            </div>
            <div class="volume-row">
                <i class="fa-solid fa-volume-up" style="font-size:0.8rem; color:#b3b3b3;"></i>
                <div class="vol-bar" id="volBar">
                    <div class="vol-fill" id="volFill" style="width:70%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="libraryDrawer" class="drawer">
        <div class="drawer-header">
            <span>📚 Tu Biblioteca</span>
            <i class="fa-solid fa-xmark" id="closeDrawer"></i>
        </div>
        <div class="drawer-content" id="drawerContent"></div>
    </div>

    <div id="queueDrawer" class="drawer drawer-right">
        <div class="drawer-header">
            <span>⏯️ Cola de reproducción</span>
            <i class="fa-solid fa-xmark" id="closeQueueDrawer"></i>
        </div>
        <div class="drawer-content" id="queueDrawerContent"></div>
    </div>

    <div id="playlistSelector" class="playlist-selector">
        <h4><i class="fa-solid fa-list"></i> Añadir a playlist</h4>
        <div id="playlistSelectorList"></div>
        <div style="margin-top: 12px; text-align: center;">
            <button class="btn-green" id="closePlaylistSelector" style="padding: 8px 20px;">Cancelar</button>
        </div>
    </div>

    <div id="fullscreenMedia" class="fullscreen-media">
        <div class="close-fullscreen" id="closeFullscreen">
            <i class="fa-solid fa-xmark"></i>
        </div>
        <div id="fullscreenVinyl" class="fullscreen-vinyl">
            <img id="fullscreenVinylImg" src="">
        </div>
    </div>

    <input type="file" id="folderInput" class="hidden-input" webkitdirectory directory multiple>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Nueva Playlist</h3>
            <input type="text" id="modalInput" placeholder="Nombre...">
            <div class="modal-buttons">
                <button class="btn-flat" style="background:transparent; color:white; border:none;" id="modalCancel">Cancelar</button>
                <button class="btn-green" id="modalConfirm">Crear</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        let allTracks = [], filteredTracks = [], playbackHistory = [];
        let coverCache = new Map();
        let currentIndex = -1, isShuffle = false, isRepeat = false, isDragging = false;
        let currentMediaURL = null;
        let playQueue = [];
        let playlists = [];
        let currentTab = 'lib';
        let activePlaylistIdx = -1;
        let currentFolderName = "";
        let pendingTrackForPlaylist = null;

        const audio = document.getElementById('audioPlayer');
        let active = audio;

        // ==================== FUNCIONES AUXILIARES ====================
        function fmt(sec) { 
            if(isNaN(sec) || !isFinite(sec)) return "0:00";
            const m = Math.floor(sec/60), s = Math.floor(sec%60); 
            return `${m}:${s<10?'0':''}${s}`; 
        }
        
        function getCoverURL(name) { 
            return coverCache.get(name.toLowerCase().trim()) || 'https://via.placeholder.com/150?text=🎵'; 
        }

        // ==================== CONFIGURACIÓN (PERSISTENCIA) ====================
        async function saveConfig() {
            const configData = {
                version: "1.0",
                lastTrack: currentIndex !== -1 ? allTracks[currentIndex]?.name : null,
                currentTime: active.currentTime || 0,
                queue: playQueue,
                playlists: playlists,
                isShuffle: isShuffle,
                isRepeat: isRepeat,
                activePlaylistIdx: activePlaylistIdx,
                folderName: currentFolderName,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem(`musica_config_${currentFolderName || 'default'}`, JSON.stringify(configData));
            localStorage.setItem('musica_backup', JSON.stringify(configData));
        }

        async function loadConfig() {
            if (currentFolderName) {
                const saved = localStorage.getItem(`musica_config_${currentFolderName}`);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        playlists = data.playlists || [];
                        playQueue = data.queue || [];
                        isShuffle = data.isShuffle || false;
                        isRepeat = data.isRepeat || false;
                        activePlaylistIdx = data.activePlaylistIdx !== undefined ? data.activePlaylistIdx : -1;
                        updateShuffleRepeatUI();
                        updateStatusLabel();
                        renderQueueDrawer();
                        renderLibrary();
                        
                        if (data.lastTrack && allTracks.length > 0 && data.lastTrack !== null) {
                            const idx = allTracks.findIndex(t => t.name === data.lastTrack);
                            if (idx !== -1) {
                                setTimeout(async () => {
                                    await playIndex(idx);
                                    if (active && data.currentTime && data.currentTime > 0) {
                                        active.currentTime = data.currentTime;
                                        active.pause();
                                        document.getElementById('playPauseBtn').className = "fa-solid fa-circle-play play-btn";
                                    }
                                }, 500);
                            }
                        }
                        return;
                    } catch(e) {}
                }
            }
            
            const backup = localStorage.getItem('musica_backup');
            if(backup) {
                try {
                    const data = JSON.parse(backup);
                    playlists = data.playlists || [];
                    playQueue = data.queue || [];
                    isShuffle = data.isShuffle || false;
                    isRepeat = data.isRepeat || false;
                    activePlaylistIdx = data.activePlaylistIdx !== undefined ? data.activePlaylistIdx : -1;
                } catch(e) {}
            }
            updateShuffleRepeatUI();
            updateStatusLabel();
            renderQueueDrawer();
            renderLibrary();
        }

        function updateShuffleRepeatUI() {
            const shuffleIcon = document.getElementById('shuffleIcon');
            const repeatIcon = document.getElementById('repeatIcon');
            if(isShuffle) shuffleIcon.classList.add('active-btn');
            else shuffleIcon.classList.remove('active-btn');
            if(isRepeat) repeatIcon.classList.add('active-btn');
            else repeatIcon.classList.remove('active-btn');
        }

        function updateStatusLabel() {
            const label = document.getElementById('activePlaylistLabel');
            const indicator = document.getElementById('plIndicator');
            if(activePlaylistIdx !== -1 && playlists[activePlaylistIdx]) {
                const name = playlists[activePlaylistIdx].name.toUpperCase();
                label.innerText = `PLAYLIST: ${name}`;
                indicator.innerText = `🎵 Reproduciendo: ${name}`;
                indicator.style.display = 'block';
            } else {
                label.innerText = '';
                indicator.style.display = 'none';
            }
        }

        // ==================== SELECCIÓN DE CARPETA (SOLO MP3) ====================
        async function selectFolder() {
            const input = document.getElementById('folderInput');
            input.value = '';
            input.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if(files.length === 0) return;
                
                const firstFile = files[0];
                const pathParts = firstFile.webkitRelativePath.split('/');
                currentFolderName = pathParts[0];
                
                allTracks = [];
                coverCache.clear();
                const audioFiles = [];
                const coverFiles = new Map();
                
                for (const file of files) {
                    const relativePath = file.webkitRelativePath;
                    const pathParts2 = relativePath.split('/');
                    const fileName = pathParts2[pathParts2.length - 1];
                    const subFolder = pathParts2.length > 2 ? pathParts2[1] : "";
                    const ext = fileName.toLowerCase();
                    
                    if (ext.endsWith('.mp3')) {
                        audioFiles.push(file);
                    }
                    if (subFolder.toLowerCase() === 'portadas') {
                        const nameWithoutExt = fileName.replace(/\.[^/.]+$/, "").toLowerCase().trim();
                        const url = URL.createObjectURL(file);
                        coverFiles.set(nameWithoutExt, url);
                    }
                }
                
                for (const file of audioFiles) {
                    allTracks.push({
                        name: file.name,
                        fileObj: file,
                        getFile: async () => file
                    });
                }
                
                for (const [name, url] of coverFiles) {
                    coverCache.set(name, url);
                }
                
                filteredTracks = [...allTracks];
                renderLibrary();
                document.getElementById('emptyState').style.display = 'none';
                const folderInfo = document.getElementById('folderInfo');
                folderInfo.style.display = 'flex';
                document.getElementById('folderName').innerText = currentFolderName;
                document.getElementById('trackCount').innerText = allTracks.length;
                
                await loadConfig();
                await saveConfig();
            };
            input.click();
        }

        // ==================== RENDER BIBLIOTECA ====================
        function renderLibrary() {
            const trackContainer = document.getElementById('trackListContainer');
            const playlistContainer = document.getElementById('playlistListContainer');
            const emptyState = document.getElementById('emptyState');
            
            if(currentTab === 'lib') {
                trackContainer.style.display = 'flex';
                playlistContainer.style.display = 'none';
                trackContainer.innerHTML = '';
                if(allTracks.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';
                const tracksToShow = filteredTracks.length ? filteredTracks : allTracks;
                tracksToShow.forEach((track, idx) => {
                    const originalIdx = allTracks.indexOf(track);
                    const cleanName = track.name.replace(/\.[^/.]+$/, "");
                    const [t, a] = cleanName.split(' - ');
                    const div = document.createElement('div');
                    div.className = `track-item ${originalIdx === currentIndex ? 'active' : ''}`;
                    div.innerHTML = `
                        <img class="track-cover" src="${getCoverURL(cleanName)}">
                        <div class="track-info">
                            <div class="track-name">${t || cleanName}</div>
                            <div class="track-artist">${a || 'Desconocido'}</div>
                        </div>
                        <div class="track-actions">
                            <i class="fa-regular fa-square-plus track-btn" data-action="queue" data-idx="${originalIdx}"></i>
                            <i class="fa-solid fa-list track-btn track-btn-playlist" data-action="playlist" data-idx="${originalIdx}"></i>
                        </div>
                    `;
                    const queueBtn = div.querySelector('[data-action="queue"]');
                    const playlistBtn = div.querySelector('[data-action="playlist"]');
                    queueBtn.onclick = (e) => { e.stopPropagation(); addToQueue(originalIdx); };
                    playlistBtn.onclick = (e) => { e.stopPropagation(); showPlaylistSelector(originalIdx); };
                    div.onclick = () => { activePlaylistIdx = -1; updateStatusLabel(); playIndex(originalIdx); };
                    trackContainer.appendChild(div);
                });
            } else {
                trackContainer.style.display = 'none';
                playlistContainer.style.display = 'flex';
                playlistContainer.innerHTML = `<div class="track-item" style="justify-content:center; background:#1db954; color:black; margin-bottom:8px;" onclick="createPlaylist()">+ CREAR PLAYLIST</div>`;
                playlists.forEach((p, i) => {
                    const div = document.createElement('div');
                    div.className = `playlist-item ${activePlaylistIdx === i ? 'active' : ''}`;
                    let coverHtml = '';
                    if(p.image) coverHtml = `<img class="playlist-cover" src="${p.image}">`;
                    else {
                        const imgs = p.songs.slice(0,4).map(s => `<img src="${getCoverURL(s.replace(/\.[^/.]+$/, ""))}">`);
                        while(imgs.length < 4) imgs.push('<div style="background:#282828"></div>');
                        coverHtml = `<div class="playlist-cover-grid">${imgs.join('')}</div>`;
                    }
                    div.innerHTML = `${coverHtml}<div class="track-info"><div class="track-name">${p.name}</div><div class="track-artist">${p.songs.length} canciones</div></div>`;
                    div.onclick = () => { activePlaylistIdx = i; playPlaylist(i); };
                    playlistContainer.appendChild(div);
                });
            }
        }

        // ==================== SELECTOR DE PLAYLIST ====================
        function showPlaylistSelector(trackIdx) {
            pendingTrackForPlaylist = trackIdx;
            const selector = document.getElementById('playlistSelector');
            const listContainer = document.getElementById('playlistSelectorList');
            listContainer.innerHTML = '';
            
            const createOption = document.createElement('div');
            createOption.className = 'playlist-option create-playlist-option';
            createOption.innerHTML = '<i class="fa-solid fa-plus"></i> Crear nueva playlist';
            createOption.onclick = () => {
                selector.classList.remove('open');
                createPlaylistAndAdd(pendingTrackForPlaylist);
            };
            listContainer.appendChild(createOption);
            
            if (playlists.length === 0) {
                const noPlaylists = document.createElement('div');
                noPlaylists.style.padding = '12px';
                noPlaylists.style.textAlign = 'center';
                noPlaylists.style.color = '#888';
                noPlaylists.innerText = 'No hay playlists. Crea una nueva.';
                listContainer.appendChild(noPlaylists);
            } else {
                playlists.forEach((p, i) => {
                    const option = document.createElement('div');
                    option.className = 'playlist-option';
                    option.innerHTML = `<i class="fa-solid fa-list"></i> ${p.name}`;
                    option.onclick = () => {
                        addToPlaylist(pendingTrackForPlaylist, i);
                        selector.classList.remove('open');
                        pendingTrackForPlaylist = null;
                    };
                    listContainer.appendChild(option);
                });
            }
            selector.classList.add('open');
        }

        function closePlaylistSelector() {
            document.getElementById('playlistSelector').classList.remove('open');
            pendingTrackForPlaylist = null;
        }

        async function createPlaylistAndAdd(trackIdx) {
            openModal("Nueva Playlist", async (name) => {
                if(name) {
                    const newPlaylist = { name, songs: [], image: null };
                    playlists.push(newPlaylist);
                    const newIdx = playlists.length - 1;
                    if (trackIdx !== null && allTracks[trackIdx]) {
                        playlists[newIdx].songs.push(allTracks[trackIdx].name);
                    }
                    renderLibrary();
                    await saveConfig();
                }
            });
        }

        async function addToPlaylist(trackIdx, playlistIdx) {
            if (trackIdx !== null && allTracks[trackIdx] && playlists[playlistIdx]) {
                const trackName = allTracks[trackIdx].name;
                if (!playlists[playlistIdx].songs.includes(trackName)) {
                    playlists[playlistIdx].songs.push(trackName);
                    renderLibrary();
                    await saveConfig();
                }
            }
        }

        // ==================== FUNCIONES PLAYLIST ====================
        function createPlaylist() {
            openModal("Nueva Playlist", async (name) => {
                if(name) {
                    playlists.push({ name, songs: [], image: null });
                    renderLibrary();
                    await saveConfig();
                }
            });
        }

        function renamePlaylist(idx) {
            openModal("Renombrar Playlist", async (newName) => {
                if(newName) {
                    playlists[idx].name = newName;
                    renderLibrary();
                    updateStatusLabel();
                    await saveConfig();
                }
            }, playlists[idx].name);
        }

        async function deletePlaylist(idx) {
            playlists.splice(idx, 1);
            if(activePlaylistIdx === idx) activePlaylistIdx = -1;
            renderLibrary();
            updateStatusLabel();
            await saveConfig();
        }

        function changePlaylistPhoto(idx) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async (event) => {
                    playlists[idx].image = event.target.result;
                    renderLibrary();
                    await saveConfig();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function playPlaylistRandom(idx) {
            isShuffle = true;
            updateShuffleRepeatUI();
            activePlaylistIdx = idx;
            playPlaylist(idx);
            saveConfig();
        }

        // ==================== FUNCIONES COLA ====================
        function addToQueue(trackIdx) { 
            playQueue.push(trackIdx); 
            renderQueueDrawer(); 
            saveConfig(); 
        }
        
        function playNowFromQueue(qIdx) {
            const trackIdx = playQueue[qIdx];
            playQueue.splice(qIdx, 1);
            playIndex(trackIdx);
            renderQueueDrawer();
            saveConfig();
        }
        
        async function removeFromQueue(qIdx) {
            playQueue.splice(qIdx, 1);
            renderQueueDrawer();
            await saveConfig();
        }

        function renderQueueDrawer() {
            const container = document.getElementById('queueDrawerContent');
            if(!container) return;
            container.innerHTML = '';
            playQueue.forEach((idx, qIndex) => {
                const track = allTracks[idx];
                if(!track) return;
                const cleanName = track.name.replace(/\.[^/.]+$/, "");
                const [t, a] = cleanName.split(' - ');
                const div = document.createElement('div');
                div.className = 'drawer-item';
                div.innerHTML = `
                    <img class="track-cover" src="${getCoverURL(cleanName)}">
                    <div class="track-info">
                        <div class="track-name">${t || cleanName}</div>
                        <div class="track-artist">${a || 'Desconocido'}</div>
                    </div>
                    <i class="fa-solid fa-trash" style="color:#ff4444; padding:8px;" onclick="removeFromQueue(${qIndex})"></i>
                `;
                div.onclick = (e) => { if(e.target.tagName !== 'I') playNowFromQueue(qIndex); };
                container.appendChild(div);
            });
            if(playQueue.length === 0) container.innerHTML = '<div class="empty-state">Cola vacía</div>';
        }

        function renderDrawerLibrary() {
            const container = document.getElementById('drawerContent');
            container.innerHTML = '';
            allTracks.forEach((track, idx) => {
                const cleanName = track.name.replace(/\.[^/.]+$/, "");
                const [t, a] = cleanName.split(' - ');
                const div = document.createElement('div');
                div.className = 'drawer-item';
                div.innerHTML = `<img class="track-cover" src="${getCoverURL(cleanName)}"><div class="track-info"><div class="track-name">${t || cleanName}</div><div class="track-artist">${a || 'Desconocido'}</div></div>`;
                div.onclick = () => { activePlaylistIdx = -1; updateStatusLabel(); playIndex(idx); document.getElementById('libraryDrawer').classList.remove('open'); };
                container.appendChild(div);
            });
            if(allTracks.length === 0) container.innerHTML = '<div class="empty-state">No hay música</div>';
        }

        // ==================== REPRODUCCIÓN ====================
        function playPlaylist(idx) {
            const p = playlists[idx];
            if(!p.songs.length) return;
            playQueue = [];
            let songsToLoad = [...p.songs];
            if(isShuffle) songsToLoad = songsToLoad.sort(() => Math.random() - 0.5);
            songsToLoad.forEach(sName => {
                const trackIdx = allTracks.findIndex(t => t.name === sName);
                if(trackIdx !== -1) playQueue.push(trackIdx);
            });
            if(playQueue.length) playIndex(playQueue.shift());
            renderQueueDrawer();
            updateStatusLabel();
            saveConfig();
        }

        function showFullscreenMedia() {
            const imgUrl = document.getElementById('playerCover').src;
            if(imgUrl && !imgUrl.includes('placeholder')) {
                document.getElementById('fullscreenVinylImg').src = imgUrl;
                document.getElementById('fullscreenMedia').classList.add('active');
            }
        }

        function closeFullscreenMedia() {
            document.getElementById('fullscreenMedia').classList.remove('active');
        }

        async function playIndex(index) {
            if(index < 0 || index >= allTracks.length) return;
            if(currentIndex !== -1 && currentIndex !== index) playbackHistory.push(currentIndex);
            currentIndex = index;
            const track = allTracks[index];
            const file = track.fileObj;
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            const [titulo, autor] = cleanName.split(' - ');
            
            document.getElementById('playerTitle').innerText = titulo || cleanName;
            document.getElementById('playerArtist').innerText = autor || 'Desconocido';
            const imgURL = getCoverURL(cleanName);
            const playerCover = document.getElementById('playerCover');
            playerCover.src = imgURL;
            playerCover.style.display = 'block';
            
            audio.pause();
            
            if(currentMediaURL) URL.revokeObjectURL(currentMediaURL);
            currentMediaURL = URL.createObjectURL(file);
            
            audio.src = currentMediaURL;
            audio.play().catch(e => console.log("Error:", e));
            active = audio;
            
            document.getElementById('playPauseBtn').className = "fa-solid fa-circle-pause play-btn";
            renderLibrary();
            
            active.onended = () => nextTrack();
            active.ontimeupdate = () => updateProgress();
            await saveConfig();
        }

        function updateProgress() {
            if(isDragging) return;
            const duration = active.duration || 0;
            const current = active.currentTime || 0;
            const pct = (duration > 0) ? (current / duration) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('currentTime').innerText = fmt(current);
            document.getElementById('totalTime').innerText = fmt(duration);
        }

        function nextTrack() {
            if(isRepeat) { playIndex(currentIndex); return; }
            let next = playQueue.length > 0 ? playQueue.shift() : (isShuffle ? Math.floor(Math.random() * allTracks.length) : (currentIndex + 1) % allTracks.length);
            playIndex(next);
            renderQueueDrawer();
            saveConfig();
        }

        function prevTrack() {
            if(active.currentTime > 3) { active.currentTime = 0; return; }
            playIndex(playbackHistory.length > 0 ? playbackHistory.pop() : (currentIndex - 1 + allTracks.length) % allTracks.length);
        }

        function togglePlay() {
            if(active.paused) {
                active.play();
                document.getElementById('playPauseBtn').className = "fa-solid fa-circle-pause play-btn";
            } else {
                active.pause();
                document.getElementById('playPauseBtn').className = "fa-solid fa-circle-play play-btn";
            }
        }

        function toggleShuffle() { isShuffle = !isShuffle; updateShuffleRepeatUI(); saveConfig(); }
        function toggleRepeat() { isRepeat = !isRepeat; updateShuffleRepeatUI(); saveConfig(); }

        // ==================== MODAL ====================
        function openModal(title, callback, defaultValue = "") {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            const input = document.getElementById('modalInput');
            input.value = defaultValue;
            modal.style.display = 'flex';
            input.focus();
            document.getElementById('modalConfirm').onclick = () => {
                callback(input.value);
                modal.style.display = 'none';
            };
            document.getElementById('modalCancel').onclick = () => modal.style.display = 'none';
        }

        // ==================== DRAG EVENTS ====================
        function initDragEvents() {
            const progressBar = document.getElementById('progressBar');
            
            const handleMove = (clientX) => {
                const rect = progressBar.getBoundingClientRect();
                let pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                document.getElementById('progressFill').style.width = (pct * 100) + '%';
                if (active && active.duration) {
                    active.currentTime = pct * active.duration;
                }
            };
            
            progressBar.onmousedown = (e) => {
                isDragging = true;
                handleMove(e.clientX);
                const move = (e) => handleMove(e.clientX);
                const stop = () => { isDragging = false; window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', stop);
                e.preventDefault();
            };
            
            progressBar.ontouchstart = (e) => {
                isDragging = true;
                const touch = e.touches[0];
                handleMove(touch.clientX);
                const move = (te) => {
                    const t = te.touches[0];
                    handleMove(t.clientX);
                };
                const stop = () => { isDragging = false; window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop); };
                window.addEventListener('touchmove', move, {passive: false});
                window.addEventListener('touchend', stop);
                e.preventDefault();
            };
            
            const volBar = document.getElementById('volBar');
            volBar.onmousedown = (e) => {
                const move = (e) => {
                    const rect = volBar.getBoundingClientRect();
                    let pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    document.getElementById('volFill').style.width = (pct * 100) + '%';
                    audio.volume = pct;
                };
                const stop = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', stop);
            };
            volBar.ontouchstart = (e) => {
                const move = (te) => {
                    const touch = te.touches[0];
                    const rect = volBar.getBoundingClientRect();
                    let pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
                    document.getElementById('volFill').style.width = (pct * 100) + '%';
                    audio.volume = pct;
                };
                const stop = () => { window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop); };
                window.addEventListener('touchmove', move, {passive: false});
                window.addEventListener('touchend', stop);
            };
        }

        // ==================== INICIALIZACIÓN ====================
        function init() {
            document.getElementById('fabBtn').onclick = () => selectFolder();
            document.getElementById('menuBtn').onclick = () => { renderDrawerLibrary(); document.getElementById('libraryDrawer').classList.add('open'); };
            document.getElementById('queueBtn').onclick = () => { renderQueueDrawer(); document.getElementById('queueDrawer').classList.add('open'); };
            document.getElementById('closeDrawer').onclick = () => document.getElementById('libraryDrawer').classList.remove('open');
            document.getElementById('closeQueueDrawer').onclick = () => document.getElementById('queueDrawer').classList.remove('open');
            document.getElementById('closePlaylistSelector').onclick = () => closePlaylistSelector();
            document.getElementById('closeFullscreen').onclick = () => closeFullscreenMedia();
            document.getElementById('playerCover').onclick = () => showFullscreenMedia();
            document.getElementById('prevBtn').onclick = () => prevTrack();
            document.getElementById('nextBtn').onclick = () => nextTrack();
            document.getElementById('playPauseBtn').onclick = () => togglePlay();
            document.getElementById('shuffleIcon').onclick = () => toggleShuffle();
            document.getElementById('repeatIcon').onclick = () => toggleRepeat();
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    renderLibrary();
                };
            });
            
            document.getElementById('searchInput').oninput = (e) => {
                const q = e.target.value.toLowerCase();
                filteredTracks = allTracks.filter(t => t.name.toLowerCase().includes(q));
                renderLibrary();
            };
            
            initDragEvents();
            audio.volume = 0.7;
            document.getElementById('volFill').style.width = '70%';
        }
        
        window.addToQueue = addToQueue;
        window.playNowFromQueue = playNowFromQueue;
        window.removeFromQueue = removeFromQueue;
        window.createPlaylist = createPlaylist;
        window.renamePlaylist = renamePlaylist;
        window.deletePlaylist = deletePlaylist;
        window.changePlaylistPhoto = changePlaylistPhoto;
        window.playPlaylistRandom = playPlaylistRandom;
        window.addToPlaylist = addToPlaylist;
        
        init();
    </script>
</body>
</html>
